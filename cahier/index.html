  if(q.type==='html')return '<div class="xp-embed" contenteditable="false">'+(q.html||'')+'</div>';
  const head='<div class="xp-qh" contenteditable="false"><span class="xp-n">'+n+'</span><span class="xp-p">'+esc(q.prompt)+'</span>'+pts+'</div>';
  let body='';
  if(q.type==='open'){
    body=ed?'<textarea class="xp-open" data-q="'+esc(q.id)+'" rows="3" placeholder="Rédigez votre réponse…">'+esc(ans||'')+'</textarea>'
           :'<div class="xp-ink">'+(ans?esc(ans):'<i class="xp-empty">Sans réponse</i>')+'</div>';
  } else if(q.type==='short'){
    body=ed?'<div><input class="xp-short" data-q="'+esc(q.id)+'" value="'+esc(ans||'')+'" placeholder="Réponse…"></div>'
           :'<div class="xp-ink">'+(ans?esc(ans):'<i class="xp-empty">Sans réponse</i>')+'</div>';
  } else if(q.type==='qcm'||q.type==='vf'){
    body='<div class="xp-opts">'+(q.options||[]).map((o,oi)=>{ const on=String(ans)===String(oi);
      return ed?'<label class="xp-opt'+(on?' on':'')+'"><input type="radio" name="xq_'+esc(q.id)+'" value="'+oi+'"'+(on?' checked':'')+' data-q="'+esc(q.id)+'"><span>'+esc(o)+'</span></label>'
               :'<div class="xp-opt'+(on?' on':'')+'">'+(on?'●':'○')+' <span>'+esc(o)+'</span></div>'; }).join('')+'</div>';
  } else if(q.type==='multi'){
    const set=new Set(String(ans||'').split(',').filter(x=>x!==''));
    body='<div class="xp-opts">'+(q.options||[]).map((o,oi)=>{ const on=set.has(String(oi));
      return ed?'<label class="xp-opt'+(on?' on':'')+'"><input type="checkbox" class="xp-cb" value="'+oi+'"'+(on?' checked':'')+' data-q="'+esc(q.id)+'"><span>'+esc(o)+'</span></label>'
               :'<div class="xp-opt'+(on?' on':'')+'">'+(on?'☑':'☐')+' <span>'+esc(o)+'</span></div>'; }).join('')+'</div>';
  } else if(q.type==='fill'){
    let vals=[]; try{ vals=JSON.parse(ans||'[]')||[]; }catch(_){ vals=[]; }
    let gi=0;
    body='<p class="xp-fill">'+parseFill(q.prompt).map(tok=>{
      if(tok.t==='txt')return esc(tok.v);
      const i=gi++; const v=vals[i]||''; const wch=Math.max(6,(tok.v||'').length+3);
      return ed?'<input class="xp-gap" data-q="'+esc(q.id)+'" data-gap="'+i+'" style="width:'+wch+'ch" value="'+esc(v)+'">'
               :'<span class="xp-ink xp-gapv">'+(v?esc(v):'________')+'</span>';
    }).join('')+'</p>';
  } else if(q.type==='match'){
    let vals=[]; try{ vals=JSON.parse(ans||'[]')||[]; }catch(_){ vals=[]; }
    const rights=seededShuffle((q.pairs||[]).map(x=>x.r),q.id);
    body='<div class="xp-match">'+(q.pairs||[]).map((pr,li)=>{

// Real page boundaries: insert invisible spacer blocks so content is pushed off the
// gap onto the next page (Enter near the bottom then continues on the next page).
// Only sibling <div>s are added/removed, so the caret/selection is never disturbed.
let pgRAF=0;
function removeSpacers(root){ (root||paper).querySelectorAll('.pgspacer').forEach(s=>s.remove()); }
// stray text/inline nodes typed straight into the page get wrapped in a <p> so they page-break too
function normalizeBlocks(){ const BLK=/^(P|DIV|H1|H2|H3|H4|UL|OL|BLOCKQUOTE|TABLE|HR|DL|PRE|FIGURE)$/; let run=null;
  [...paper.childNodes].forEach(n=>{
    const isBlk = n.nodeType===1 && (BLK.test(n.tagName) || (n.classList && (n.classList.contains('nb-clip')||n.classList.contains('pgspacer')||n.classList.contains('lockbadge'))));
    if(isBlk){ run=null; return; }
    if(n.nodeType===3 && !n.textContent.trim()){ return; } // ignore whitespace-only text
    if(!run){ run=document.createElement('p'); paper.insertBefore(run,n); }
    run.appendChild(n);
  });
}
function paginate(){
  const p=currentPage();
  if(state.view!=='paged' || !p){ removeSpacers(); return; }
  removeSpacers(); normalizeBlocks();
  const gap=parseFloat(getComputedStyle(paper).getPropertyValue('--gap'))||33;
  const PG_USABLE=Math.round(gap*30), PG_PITCH=Math.round(gap*32); // page = 30 lines + 2-line gap, aligned to the rule grid
  let pageTop=0;
  const kids=[...paper.children].filter(el=>el.nodeType===1 && !el.classList.contains('lockbadge') && !el.classList.contains('pgspacer'));
  for(const b of kids){
    for(let guard=0; guard<60; guard++){
      const usableBottom=pageTop+PG_USABLE, nextTop=pageTop+PG_PITCH;
      const top=b.offsetTop, bottom=top+b.offsetHeight;
      if(top>=nextTop){ pageTop=nextTop; continue; }               // block already on a later page
      // push if it starts in the gap band, or would cross into it (unless it already starts at the page top and is just tall)
      const pushable = (top>=usableBottom-1) || (bottom>usableBottom && top>pageTop+2);
      if(pushable){ const fill=nextTop-top; if(fill>0){ const sp=document.createElement('div'); sp.className='pgspacer'; sp.contentEditable='false'; sp.style.height=fill+'px'; b.parentNode.insertBefore(sp,b); } pageTop=nextTop; }
      break;
    }
  }
}
// run on the next frame after typing so text is pushed off the gap immediately (coalesced, cheap)
function schedulePaginate(){ if(state.view!=='paged')return; if(pgRAF)return; pgRAF=requestAnimationFrame(()=>{pgRAF=0;paginate();}); }

function capturePage(){ const p=currentPage(); if(!p)return;

/* ═════ scientific calculator ═════ */
function calcEval(src,deg){
  let s=String(src||''); if(!s.trim())return '';
  s=s.replace(/π/g,'pi').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/√/g,'sqrt');
  s=s.replace(/([0-9.)\]]+)\s*%/g,'($1/100)');
  for(let i=0;i<6;i++) s=s.replace(/(\d+(?:\.\d+)?|\([^()]*\))\s*!/g,'fact($1)');
  s=s.replace(/(\d|\))\s*(\()/g,'$1*$2').replace(/(\d)\s*([A-Za-z])/g,'$1*$2').replace(/(\))\s*([A-Za-z0-9])/g,'$1*$2');
  s=s.replace(/\^/g,'**');
  if(/[^0-9+\-*/.,%()\sA-Za-z_]/.test(s)) throw 0;
  const D=deg?Math.PI/180:1;
  const scope={ pi:Math.PI, e:Math.E,
    sin:x=>Math.sin(x*D),cos:x=>Math.cos(x*D),tan:x=>Math.tan(x*D),
    asin:x=>Math.asin(x)/D,acos:x=>Math.acos(x)/D,atan:x=>Math.atan(x)/D,
    sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,exp:Math.exp,
    ln:Math.log,log:x=>Math.log10(x),log2:Math.log2,
    round:Math.round,floor:Math.floor,ceil:Math.ceil,sign:Math.sign,pow:Math.pow,
    fact:n=>{n=Math.round(n);if(n<0||n>170)return NaN;let r=1;for(let k=2;k<=n;k++)r*=k;return r;} };
  (s.match(/[A-Za-z_][A-Za-z0-9_]*/g)||[]).forEach(id=>{ if(!(id in scope)) throw 0; });
  const names=Object.keys(scope);
  const v=new Function(...names,'return ('+s+')')(...names.map(n=>scope[n]));
  if(typeof v!=='number'||!isFinite(v)) return 'Erreur';
  return String(Math.round((v+Number.EPSILON)*1e10)/1e10);
}
let calcExprStr='', calcDeg=true, calcAns='0';
const CALC_KEYS=[
  ['sin','sin(','fn'],['cos','cos(','fn'],['tan','tan(','fn'],['ln','ln(','fn'],['log','log(','fn'],
  ['√','sqrt(','fn'],['xʸ','^','fn'],['π','π','fn'],['e','e','fn'],['n!','!','fn'],
  ['(','(','op'],[')',')','op'],['%','%','op'],['AC','#ac','clr'],['⌫','#del','clr'],
  ['7','7',''],['8','8',''],['9','9',''],['÷','÷','op'],['×','×','op'],
  ['4','4',''],['5','5',''],['6','6',''],['−','-','op'],['+','+','op'],
  ['1','1',''],['2','2',''],['3','3',''],['.','.',''],['Ans','#ans','fn'],
  ['0','0','w3'],['=','#eq','eq w2'],
];
function calcRenderKeys(){ $('#calcKeys').innerHTML=CALC_KEYS.map(k=>'<button class="'+(k[2]||'')+'" data-k="'+esc(k[1])+'">'+esc(k[0])+'</button>').join('');
  $('#calcKeys').querySelectorAll('button').forEach(b=>b.onclick=()=>calcKey(b.getAttribute('data-k'))); }
function calcShow(){ $('#calcExpr').textContent=calcExprStr; let r; try{ r=calcEval(calcExprStr,calcDeg); }catch(_){ r=calcExprStr?'Erreur':''; } $('#calcRes').textContent=(r===''?'0':r); }
function calcKey(k){
  if(k==='#ac')calcExprStr='';
  else if(k==='#del')calcExprStr=calcExprStr.slice(0,-1);
  else if(k==='#ans')calcExprStr+=calcAns;
  else if(k==='#eq'){ try{ const v=calcEval(calcExprStr,calcDeg); if(v&&v!=='Erreur'){ calcAns=v; calcExprStr=v; } }catch(_){} }
  else calcExprStr+=k;
  calcShow();
}

/* ── editable tables: track the active cell, add/remove rows & columns, recolour ── */
let _tcell=null;
function _cellIn(sel){ const n=sel&&sel.anchorNode; return n?(n.nodeType===1?n:n.parentElement).closest('.nb-tbl td,.nb-tbl th'):null; }
paper.addEventListener('click',e=>{
  const cell=e.target.closest('.nb-tbl td,.nb-tbl th'); if(cell)_tcell=cell;
  const add=e.target.closest('[data-tadd]'),del=e.target.closest('[data-tdel]');
  if(!add&&!del)return;
  const tbl=e.target.closest('.nb-tablew').querySelector('.nb-tbl'); if(!tbl)return;
  const body=tbl.tBodies[0]||tbl, rows=[...tbl.rows];
  const cmd=(add||del).getAttribute(add?'data-tadd':'data-tdel');
  if(add&&cmd==='row'){ const cols=rows[0]?rows[0].cells.length:2; const tr=body.insertRow(-1); for(let i=0;i<cols;i++)tr.insertCell(-1).textContent='—'; }
  else if(add&&cmd==='col'){ rows.forEach((r,i)=>{ const c=document.createElement(i===0?'th':'td'); c.textContent=i===0?'Colonne':'—'; r.appendChild(c); }); }
  else if(del&&cmd==='row'){ if(rows.length>2)tbl.deleteRow(rows.length-1); }
  else if(del&&cmd==='col'){ if(rows[0]&&rows[0].cells.length>1)rows.forEach(r=>r.deleteCell(r.cells.length-1)); }
  markDirty();
},true);

// Range-based insertion (execCommand('insertHTML') is deprecated and no-ops without a user gesture).
function insertHTML(h){ paper.focus(); const sel=window.getSelection();
  let range;
  if(sel.rangeCount && paper.contains(sel.anchorNode)) range=sel.getRangeAt(0);
  else { range=document.createRange(); range.selectNodeContents(paper); range.collapse(false); }
  range.deleteContents();
  const tpl=document.createElement('template'); tpl.innerHTML=h;
  const frag=tpl.content; const last=frag.lastChild;
  range.insertNode(frag);
  if(last){ const r2=document.createRange(); r2.setStartAfter(last); r2.collapse(true); sel.removeAllRanges(); sel.addRange(r2); }
  markDirty(); }

let impState={dir:null,file:null,fullHtml:null,sel:new Set()};
async function openImport(){const {books}=await api.books();popup('Importer','depuis le manuel',renderBookList(books));}

async function showPicker(dir,file){
  impState.dir=dir;impState.file=file;impState.sel=new Set();impState.blocks=null;
  toast('Chargement du chapitre…');
  const {html}=await api.renderChapter(dir,file);impState.fullHtml=html;
  const bx=$('.pop .box');if(bx)bx.classList.add('imp-wide');
  $('.pop .imp-body').innerHTML='<button class="imp-back" id="impBackChaps">‹ Chapitres</button>'
    +'<p class="imp-tip">Clique un <b>élément</b> pour le sélectionner (plusieurs possibles), ou <b>surligne du texte</b>. Puis insère — tes notes s’enrouleront autour, et tu pourras le redimensionner.</p>'
    +'<div class="imp-preview"><iframe id="impFrame"></iframe></div>'
    +'<div class="imp-foot"><span class="cnt" id="impCount">0 sélectionné</span><button class="primary" id="impInsert" disabled>Insérer</button></div>';
  const fr=$('#impFrame');
  fr.onload=()=>{ try{
    const cd=fr.contentDocument; const st=cd.createElement('style');
    st.textContent='.imp-hoverable{cursor:pointer}.imp-hoverable:hover{outline:2px dashed #8c2f2a;outline-offset:3px}.imp-on{outline:3px solid #8c2f2a!important;outline-offset:3px;background:rgba(201,160,84,.12)}';
    cd.head.appendChild(st);
    const cont=cd.querySelector('.book-chapter')||cd.body; const blocks=nbBlocks(cont); impState.blocks=blocks;
    blocks.forEach(b=>b.classList.add('imp-hoverable'));
    // one delegated capture listener → robust even if widgets re-render their own subtree after load
    /* Ce que l'on a sous la main : des éléments cochés, ou du texte surligné.
       L'un OU l'autre suffit — c'est ce que le panneau promet. */
    const majImp=()=>{
      const n=impState.sel.size;
      let texte='';
      try{ const s2=cd.getSelection&&cd.getSelection(); if(s2&&!s2.isCollapsed) texte=String(s2).trim(); }catch(_){ }
      const c=$('#impCount'), b2=$('#impInsert'); if(!c||!b2) return;
      if(n) c.textContent=n+' élément'+(n>1?'s':'')+' sélectionné'+(n>1?'s':'');
      else if(texte) c.textContent=texte.length+' caractère'+(texte.length>1?'s':'')+' surligné'+(texte.length>1?'s':'');
      else c.textContent='0 sélectionné';
      b2.disabled=!(n||texte);
    };
    impState.maj=majImp;
    cd.addEventListener('click',ev=>{ const b=blocks.find(x=>x===ev.target||x.contains(ev.target)); if(!b)return;
      /* un clic qui vient de finir un surlignage ne doit pas cocher l'élément
         sous le curseur : on laisse la sélection tranquille */
      let s3=null; try{ s3=cd.getSelection&&cd.getSelection(); }catch(_){ }
      if(s3&&!s3.isCollapsed&&String(s3).trim().length>1){ majImp(); return; }
      ev.preventDefault();ev.stopPropagation();
      const i=blocks.indexOf(b); b.classList.toggle('imp-on'); if(impState.sel.has(i))impState.sel.delete(i);else impState.sel.add(i);
      majImp(); },true);
    /* le surlignage : dans le cadre, et aussi quand la souris est relâchée
       au-dehors après un glissé */
    cd.addEventListener('mouseup',()=>setTimeout(majImp,0));
    cd.addEventListener('keyup',()=>setTimeout(majImp,0));
    cd.addEventListener('selectionchange',majImp);
    document.addEventListener('mouseup',()=>setTimeout(majImp,0));
  }catch(e){} };
  fr.srcdoc=html;
  $('#impInsert').onclick=doInsert;
}
function doInsert(){
  const fr=$('#impFrame'),cd=fr&&fr.contentDocument; if(!cd)return;
  let inner='',idx=null;
  if(impState.sel.size){const kids=impState.blocks||nbBlocks(cd.querySelector('.book-chapter')||cd.body);const order=[...impState.sel].sort((a,b)=>a-b);inner=order.map(i=>kids[i]?blockHTML(kids[i]):'').join('');idx=order.join(',');}
  else{const s=cd.getSelection&&cd.getSelection();if(s&&!s.isCollapsed){const d=document.createElement('div');d.appendChild(s.getRangeAt(0).cloneContents());inner=d.innerHTML;}}
  if(!inner){toast('Sélectionne un élément ou du texte.');return;}
  insertClip(idx,inner);closePopup();
}
// the real, selectable content blocks of a rendered chapter — works for both
// flow chapters (top-level children) and canvas chapters (.layout-item boxes)
function nbBlocks(cont){
  const items=[...cont.querySelectorAll('.layout-item')];
  if(items.length)return items;
  let col=cont; while(col.children.length===1 && /^(DIV|MAIN|SECTION|ARTICLE)$/.test(col.children[0].tagName)) col=col.children[0];
  return [...col.children].filter(el=>!/^(SCRIPT|STYLE)$/.test(el.tagName));
}

// a mini self-contained doc for one or more picked elements (styles + widget runtime from the source book)
function buildClipDoc(fullHtml,inner){
  const doc=new DOMParser().parseFromString(fullHtml,'text/html');
  const head=doc.head.innerHTML;
  const scripts=[...doc.querySelectorAll('body script')].map(s=>s.textContent).filter(Boolean).map(t=>'<scr'+'ipt>'+t+'</scr'+'ipt>').join('');
  // Fit-scale the imported block to the clip width (never crop): if its natural
  // width exceeds the iframe, shrink the whole block uniformly, then report the
  // SCALED height so the clip iframe sizes to what's actually shown.
  const auto='<scr'+'ipt>var _last=0;function _fit(){var bc=document.querySelector(".book-chapter");if(!bc)return document.body.scrollHeight;'
    +'bc.style.transform="";bc.style.width="";bc.style.transformOrigin="top left";'
    +'var avail=document.documentElement.clientWidth||1,nat=Math.max(bc.scrollWidth,document.body.scrollWidth);'

function wfeReadScalar(el){ const t=el.getAttribute('data-t');

// Paste: our imported clips/widgets keep their content only in data-* (the live
// iframe srcdoc is never stored), so a raw paste drops a blank iframe. Strip the
// stale srcdoc, re-id the clips, insert at the caret, then re-hydrate to rebuild.
paper.addEventListener('paste',e=>{
  const cd=e.clipboardData; if(!cd)return;
  const html=cd.getData('text/html');
  if(html){
    e.preventDefault();
    const tmp=document.createElement('div'); tmp.innerHTML=html;
    tmp.querySelectorAll('script,style,meta,link,title').forEach(n=>n.remove());
    tmp.querySelectorAll('iframe').forEach(f=>{ f.removeAttribute('srcdoc'); f.style.height=''; });
    tmp.querySelectorAll('[data-bound]').forEach(n=>n.removeAttribute('data-bound'));
    tmp.querySelectorAll('.nb-clip[data-cid]').forEach(c=>c.setAttribute('data-cid','c'+Math.random().toString(36).slice(2,9)));
    insertHTML(tmp.innerHTML);
    hydrateEmbeds(paper); bindClips(paper); markDirty();
  } else {
    const txt=cd.getData('text/plain');
    if(txt){ e.preventDefault(); insertHTML(esc(txt).replace(/\n/g,'<br>')); markDirty(); }
  }
});
/* La barre et la fenetre d'un extrait, refaites a neuf. Le nettoyeur du
   serveur les retire a l'enregistrement — a juste titre : un <iframe> stocke
   est un vecteur d'injection. On ne les stocke donc plus du tout, on les
   redessine, a partir des seuls attributs data-* qui, eux, survivent. */
function clipBar(clip){
  const t=clip.getAttribute('data-widget');
  const nom=(clip.querySelector('.src')||{}).textContent
    || (t?t:(clip.classList.contains('nb-img')?'Image':(clip.getAttribute('data-book')||'Extrait')));
  let h=CARET+'<span class="src" contenteditable="true" title="Titre (modifiable)">'+esc(nom)+'</span><span class="sp"></span>';
  if(t==='graph') h+='<button data-expand title="Ouvrir en plein écran">&#10530;</button>';
  if(t) h+='<button data-edit title="Éditer">Éditer</button>';
  h+='<button data-flip title="Placement : droite / gauche / bloc (sans habillage)">&#8646;</button>';
  if(clip.getAttribute('data-book')) h+='<button data-jump="'+esc(clip.getAttribute('data-book'))+'" title="Ouvrir le manuel">Ouvrir</button>';
  h+='<button data-rm title="Retirer">&#10005;</button>';
  return h;
}
function rebuildClips(root){
  $$('.nb-clip',root||paper).forEach(clip=>{
    /* la barre : sans ses boutons, on ne peut plus ni deplacer, ni retirer,
       ni rouvrir le manuel */
    let bar=clip.querySelector('.bar');
    if(!bar){ bar=document.createElement('div'); bar.className='bar'; clip.insertBefore(bar,clip.firstChild); }
    if(!bar.querySelector('button')) bar.innerHTML=clipBar(clip);
    /* la fenetre : une image garde la sienne (une <img> survit au nettoyage),
       tout le reste a besoin d'un cadre a remplir */
    let body=clip.querySelector('.nb-clip-body');
    if(!body){ body=document.createElement('div'); body.className='nb-clip-body'; clip.appendChild(body); }
    const besoinCadre=!clip.classList.contains('nb-img');
    if(besoinCadre&&!body.querySelector('iframe')) body.appendChild(document.createElement('iframe'));
    /* la poignee de redimensionnement */
    if(!clip.querySelector('.rz')){ const rz=document.createElement('span'); rz.className='rz';
      rz.title='Redimensionner'; clip.appendChild(rz); }
    if(clip.getAttribute('data-w')) clip.style.width=clip.getAttribute('data-w')+'px';
    clip.setAttribute('contenteditable','false');
  });
}
async function hydrateEmbeds(root){
  rebuildClips(root);
  // legacy whole-chapter embeds (older imports)
  for(const box of $$('.nb-embed',root)){const ifr=box.querySelector('iframe');if(!ifr||ifr.getAttribute('srcdoc'))continue;const slug=box.getAttribute('data-book'),file=box.getAttribute('data-file');if(!slug||!file)continue;try{const {html}=await api.renderChapter('books/'+slug,file);const doc=new DOMParser().parseFromString(html,'text/html');const cont=doc.querySelector('.book-chapter')||doc.body;ifr.srcdoc=buildClipDoc(html,cont.innerHTML);}catch(_){}}
  // element clips — re-rendered live from the source (never stored), so links stay small & current
  for(const clip of $$('.nb-clip',root)){const ifr=clip.querySelector('iframe');if(!ifr||ifr.getAttribute('srcdoc'))continue;const slug=clip.getAttribute('data-book'),file=clip.getAttribute('data-file');if(!slug||!file)continue;
    try{const {html}=await api.renderChapter('books/'+slug,file);let inner='';const idx=clip.getAttribute('data-idx');
      if(idx!=null){const doc=new DOMParser().parseFromString(html,'text/html');const cont=doc.querySelector('.book-chapter')||doc.body;const kids=nbBlocks(cont);inner=idx.split(',').map(i=>kids[+i]?blockHTML(kids[+i]):'').join('');}
      else{const t=clip.querySelector('.clip-src');inner=t?t.innerHTML:'';}
      ifr.srcdoc=buildClipDoc(html,inner);
      if(clip.getAttribute('data-w'))clip.style.width=clip.getAttribute('data-w')+'px';
    }catch(_){ifr.style.height='50px';ifr.srcdoc='<p style="font:13px sans-serif;color:#8c2f2a;padding:10px">Lien vers le manuel introuvable.</p>';}}
  // student-added interactive elements
  for(const clip of $$('.nb-clip[data-widget]',root)){ const ifr=clip.querySelector('iframe'); if(!ifr||ifr.getAttribute('srcdoc'))continue; await renderWidgetInto(clip); }
  bindClips(root);
}

function shareNote(n){ const S=1080, c=document.createElement('canvas'); c.width=S;c.height=S; const x=c.getContext('2d');
  x.fillStyle='#1a2238'; x.fillRect(0,0,S,S); x.fillStyle=HLC[n.color]; x.fillRect(0,0,14,S);
  x.fillStyle='#c9a054'; x.font='600 26px Spline Sans Mono, monospace'; x.fillText('“', 70, 150);
  x.fillStyle='#f4f1ea'; x.font='500 46px Fraunces, Georgia, serif';
  const words=n.excerpt.split(/\s+/), lines=[]; let ln='';
  words.forEach(w=>{ if(x.measureText(ln+' '+w).width>S-160){lines.push(ln);ln=w;}else ln=(ln?ln+' ':'')+w; }); if(ln)lines.push(ln);
  const shown=lines.slice(0,10); let y=S/2-shown.length*30; shown.forEach(l=>{x.fillText(l,80,y);y+=62;});
  y+=30; x.fillStyle='#c9a054'; x.font='500 22px Spline Sans Mono, monospace'; x.fillText('— '+((state.nb.student.prenom+' '+state.nb.student.nom).trim()||state.nb.brand.title), 80, Math.min(y,S-90));
  x.fillStyle='rgba(244,241,234,.5)'; x.font='400 18px Spline Sans Mono, monospace'; x.fillText((state.nb.brand.title||'')+' · '+n.subj, 80, S-50);
  let m=$('.nbshare'); if(!m){m=document.createElement('div');m.className='nbshare';document.body.appendChild(m);}
  m.innerHTML='<div class="box"><canvas></canvas><div class="row"><button class="cl">Fermer</button><button class="dl">Télécharger</button></div></div>';
  m.querySelector('canvas').replaceWith(c); c.style.width='300px';c.style.height='300px';c.style.borderRadius='6px';
  m.querySelector('.cl').onclick=()=>m.classList.remove('show'); m.onclick=e=>{if(e.target===m)m.classList.remove('show');};
  m.querySelector('.dl').onclick=()=>{ const a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download='note.png'; a.click(); };
  setTimeout(()=>m.classList.add('show'),15);
}
// dictionary + wikipedia lookup
let lookEl=null;
async function openLookup(text,which){
  text=(text||'').trim().replace(/\s+/g,' ');
  const words=text.split(' ').filter(Boolean);
  // a phrase (2–8 words) is looked up whole (locutions, expressions…); otherwise the single word
  const term=(words.length>1 && words.length<=8) ? text : (words[0]||'').replace(/[^\p{L}\p{N}\-'’]/gu,'');
  if(!term){toast('Sélectionne un mot ou une expression.');return;}
  if(!lookEl){ lookEl=document.createElement('div'); lookEl.className='nblook'; document.body.appendChild(lookEl); bindLookResize(); }
  const savedW=(state.nb&&state.nb.settings&&state.nb.settings.lookW)||0; if(savedW)lookEl.style.setProperty('--lookw',savedW+'px');
  lookEl.dataset.lemma=''; lookEl.dataset.raw=text;
  lookEl.innerHTML='<div class="grip" title="Redimensionner"></div><button class="x">&times;</button>'
    +'<header><span class="w">'+esc(term)+'</span>'
    +'<form class="hd-search"><input type="text" placeholder="Chercher un mot ou une expression…"><button type="submit" title="Chercher">→</button></form></header>'
    +'<div class="tabs"><button data-t="dico">Dictionnaire</button><button data-t="conj" style="display:none">Conjugaison</button><button data-t="wiki">Wikipédia</button></div>'
    +'<div class="body loading">Recherche…</div>';
  lookEl.querySelector('.x').onclick=()=>lookEl.classList.remove('show');
  const body=lookEl.querySelector('.body'); const tabs=lookEl.querySelectorAll('.tabs button');
  const show=t=>{ tabs.forEach(b=>b.classList.toggle('on',b.getAttribute('data-t')===t)); body.className='body loading'; body.textContent=''; if(t==='dico')fetchDico(term,body); else if(t==='wiki')fetchWiki(term,body); else fetchConj(lookEl.dataset.lemma||term,body); };
  tabs.forEach(b=>b.onclick=()=>show(b.getAttribute('data-t')));
  const sf=lookEl.querySelector('.hd-search'); sf.onsubmit=ev=>{ ev.preventDefault(); const v=sf.querySelector('input').value.trim(); if(v)openLookup(v,'dico'); };
  bindLookResize();
  setTimeout(()=>lookEl.classList.add('show'),15); show(which||'dico');
}
function bindLookResize(){ if(!lookEl)return; const grip=lookEl.querySelector('.grip'); if(!grip||grip._b)return; grip._b=1;
  grip.addEventListener('pointerdown',e=>{ e.preventDefault(); grip.setPointerCapture(e.pointerId); lookEl.classList.add('resizing'); document.body.classList.add('nb-op');
    const move=ev=>{ const w=Math.max(320,Math.min(window.innerWidth*0.94, window.innerWidth-ev.clientX)); lookEl.style.setProperty('--lookw',Math.round(w)+'px'); };
    const up=ev=>{ grip.releasePointerCapture(e.pointerId); grip.removeEventListener('pointermove',move); grip.removeEventListener('pointerup',up); lookEl.classList.remove('resizing'); document.body.classList.remove('nb-op');
      const w=parseInt(lookEl.style.getPropertyValue('--lookw'))||440; if(state.nb){ state.nb.settings=state.nb.settings||{}; state.nb.settings.lookW=w; saveSettings(); } };
    grip.addEventListener('pointermove',move); grip.addEventListener('pointerup',up); });
}
async function fetchDico(word,body){ try{
  // French Wiktionary via the MediaWiki API (CORS via origin=*); the dictionaryapi.dev /fr set is empty.
  const u='https://fr.wiktionary.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&format=json&origin=*&titles='+encodeURIComponent(word);
  const r=await fetch(u); if(!r.ok)throw 0; const j=await r.json();
  const pages=j.query&&j.query.pages; const pg=pages&&pages[Object.keys(pages)[0]]; let ex=pg&&pg.extract;
  if(!ex)throw 0;
  // keep only the French section
  const fi=ex.indexOf('== Français =='); if(fi>=0){ ex=ex.slice(fi+14); const nx=ex.search(/\n==[^=]/); if(nx>=0)ex=ex.slice(0,nx); }
  const fr=ex;
  // verb? → reveal the Conjugaison tab and resolve the infinitive
  const conjTab=lookEl&&lookEl.querySelector('[data-t="conj"]'); const single=!/\s/.test(word);
  if(conjTab){ const isVerb=single && (/\n=+\s*Verbe\b/.test(fr) || /(er|ir|re)$/i.test(word));
    if(isVerb){ conjTab.style.display=''; let lemma=word; if(!/(er|ir|re)$/i.test(word)){ const mm=fr.match(/du verbe\s+[«"'’]?\s*([a-zàâçéèêëîïôûùüÿœæ]+)/i); if(mm)lemma=mm[1]; } lookEl.dataset.lemma=lemma; }
    else conjTab.style.display='none'; }
  // stop at the noisy trailing sections
  ex=fr.split(/\n===?\s*(Traductions|Prononciation|Anagrammes|Voir aussi|Références|Vocabulaire|Dérivés|Apparentés|Synonymes|Homophones)/)[0];
  let h=''; ex.split('\n').forEach(ln=>{ ln=ln.trim(); if(!ln)return; const m=ln.match(/^=+\s*(.*?)\s*=+$/);
    if(m){ h+='<div class="pos">'+esc(m[1])+'</div>'; } else { h+='<p class="df">'+esc(ln)+'</p>'; } });
  body.className='body'; body.innerHTML=h||'<p class="loading">Aucune définition.</p>';
  body.innerHTML+='<a class="more" href="https://fr.wiktionary.org/wiki/'+encodeURIComponent(word)+'" target="_blank">Voir sur le Wiktionnaire →</a>'; }
  catch(_){ body.className='body'; body.innerHTML='<p class="loading">Aucune définition trouvée pour « '+esc(word)+' ».</p>'; } }
async function fetchConj(lemma,body){ try{
  // action=parse returns the real conjugation TABLES (prop=extracts strips them out)
  const u='https://fr.wiktionary.org/w/api.php?action=parse&page='+encodeURIComponent('Conjugaison:français/'+lemma)+'&prop=text&format=json&formatversion=2&origin=*&disableeditsection=1';
  const r=await fetch(u); if(!r.ok)throw 0; const j=await r.json(); const html=j.parse&&j.parse.text; if(!html)throw 0;
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('.mw-editsection,sup,style,script,img,.references,.NavHead,.mw-empty-elt').forEach(e=>e.remove());
  const root=doc.querySelector('.mw-parser-output')||doc.body;
  // walk headings + tables in order: headings become mode labels (Indicatif, Subjonctif…), tables become tense cards
  const nodes=[...root.querySelectorAll('h2,h3,h4,table')]; let h=''; let started=false;
  nodes.forEach(n=>{
    if(/^H[234]$/.test(n.tagName)){ const t=n.textContent.trim();
      if(!t||/^(sommaire|conjugaison|modes? impersonnels?|notes?)$/i.test(t)||/conjugaison du verbe/i.test(t))return;
      h+='<div class="conj-mode">'+esc(t)+'</div>'; return; }
    // table: skip layout/wrapper tables (they NEST the real tense tables → double-render + overlap); keep only leaf pronoun tables; drop IPA columns (cells starting with \)
    if(n.querySelector('table'))return;
    if(!/\b(je|j’|nous|vous|que je|que j’)\b/i.test(n.textContent))return;
    n.querySelectorAll('td,th').forEach(c=>{ const t=c.textContent.trim(); if(/^\\/.test(t)||/\\$/.test(t)){ c.remove(); return; } c.removeAttribute('style'); c.removeAttribute('class'); });
    n.removeAttribute('style'); n.removeAttribute('class'); n.removeAttribute('width'); h+=n.outerHTML; started=true;
  });
  if(!started) throw 0;
  body.className='body'; body.innerHTML='<div class="conjtables">'+h+'<a class="more conj-more" target="_blank" href="https://fr.wiktionary.org/wiki/Conjugaison:fran%C3%A7ais/'+encodeURIComponent(lemma)+'">Conjugaison complète →</a></div>'; }
  catch(_){ body.className='body'; body.innerHTML='<p class="loading">Conjugaison indisponible pour « '+esc(lemma)+' » (essaie l’infinitif).</p>'; } }
// fetch an exact article summary (throws on missing/disambiguation)
async function wikiSummary(title){ const r=await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title)); if(!r.ok)throw 0; const j=await r.json(); if(j.type==='disambiguation'||!(j.extract||'').trim())throw 0; return j; }
// full-text search (behaves like the Wikipédia search box)
async function wikiSearch(q){ try{ const u='https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&srlimit=8&srinfo=&format=json&origin=*'; const r=await fetch(u); if(!r.ok)return []; const j=await r.json(); return (j.query&&j.query.search)||[]; }catch(_){ return []; } }
function wikiArticleHtml(j){ let h='';
  const img=(j.originalimage&&j.originalimage.source)||(j.thumbnail&&j.thumbnail.source);
  if(img)h+='<div class="wiki-hero"><img src="'+img+'" alt=""></div>';
  if(j.description)h+='<div class="pos">'+esc(j.description)+'</div>';
  h+='<p>'+esc(j.extract||'')+'</p>';
  if(j.content_urls&&j.content_urls.desktop)h+='<a class="more" href="'+j.content_urls.desktop.page+'" target="_blank">Lire sur Wikipédia →</a>';
  return h; }
function wikiResultsHtml(list,q){ if(!list.length)return '<p class="loading">Aucun résultat pour « '+esc(q)+' ».</p>';
  return '<div class="wiki-results">'+list.map(r=>'<button class="wiki-res" data-wiki="'+esc(r.title)+'"><span class="wr-t">'+esc(r.title)+'</span>'+(r.snippet?'<span class="wr-s">'+r.snippet.replace(/<[^>]+>/g,'')+'…</span>':'')+'</button>').join('')
    +'<a class="more" target="_blank" href="https://fr.wikipedia.org/w/index.php?search='+encodeURIComponent(q)+'">Voir tous les résultats →</a></div>'; }
function wireWiki(body){ body.querySelectorAll('[data-wiki]').forEach(b=>b.onclick=()=>loadWiki(b.getAttribute('data-wiki'),body,true)); }
// render an article by exact title (from a search result click) + its "other results".
// LENIENT: shows the page even if it's a disambiguation (that's what the user clicked on).
async function loadWiki(title,body){ body.className='body loading'; body.textContent='';
  let art=null; try{ const r=await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title)); if(r.ok){ const j=await r.json(); if((j.extract||'').trim())art=j; } }catch(_){}
  const list=await wikiSearch(title);
  let h='';
  if(art){ if(art.type==='disambiguation')h+='<div class="wiki-noh">Page d’homonymie — plusieurs sens :</div>'; h+=wikiArticleHtml(art);
    const o=list.filter(r=>r.title!==art.title).slice(0,6); if(o.length)h+='<div class="wiki-more-h">Autres résultats</div>'+wikiResultsHtml(o,title); }
  else h+='<div class="wiki-noh">Aucun article « '+esc(title)+' ».</div>'+wikiResultsHtml(list,title);
  body.className='body'; body.innerHTML=h||'<p class="loading">Rien trouvé.</p>'; wireWiki(body); }
// the Wiki tab: try an exact article on the cleaned word, else (and always) show search on the raw selection
async function fetchWiki(word,body){
  const raw=(lookEl&&lookEl.dataset.raw)||word;
  let art=null; try{ art=await wikiSummary(word); }catch(_){}
  const list=await wikiSearch(raw||word);
  let h='';
  if(art){ h+=wikiArticleHtml(art); const o=list.filter(r=>r.title!==art.title).slice(0,6); if(o.length)h+='<div class="wiki-more-h">Autres résultats de recherche</div>'+wikiResultsHtml(o,raw||word); }
  else if(list.length){ h+='<div class="wiki-noh">Aucun article exact pour « '+esc(raw||word)+' » — résultats de recherche :</div>'+wikiResultsHtml(list,raw||word); }
  else h='<p class="loading">Aucun résultat pour « '+esc(raw||word)+' ».</p>';
  body.className='body'; body.innerHTML=h; wireWiki(body); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); if(lookEl)lookEl.classList.remove('show'); const m=$('.nbshare');if(m)m.classList.remove('show'); } });
// keep the badge count fresh when pages load
const _loadPage=loadPage; loadPage=function(){ _loadPage.apply(this,arguments); try{refreshNotesCount();}catch(_){} };

boot();
