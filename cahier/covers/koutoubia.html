<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koutoubia</title>
<style>
  :root{
    --paper-light:#a6d6d3;
    --paper-mid:#93c3c3;
    --paper-dark:#74a5a4;
    --ink:#355657;
    --vignette:#20393a;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--paper-mid);
  }

  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* uneven dyed-pulp tone */
  .paper-base{
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 50% at 22% 16%, var(--paper-light) 0%, transparent 60%),
      radial-gradient(ellipse 70% 60% at 84% 82%, var(--paper-dark) 0%, transparent 55%),
      radial-gradient(ellipse 90% 90% at 50% 50%, var(--paper-mid) 0%, var(--paper-dark) 100%);
  }

  /* coarse recycled-pulp speckle, the flecks in the original board */
  .fleck{
    position:absolute;
    inset:0;
    opacity:0.22;
    mix-blend-mode:multiply;
  }

  /* animated grain */
  .grain{
    position:absolute;
    inset:-10%;
    width:120%;
    height:120%;
    opacity:0.14;
    mix-blend-mode:overlay;
    animation:grainShift 1.5s steps(4) infinite;
  }

  @keyframes grainShift{
    0%   { transform:translate(0,0); }
    25%  { transform:translate(-1%,0.5%); }
    50%  { transform:translate(0.5%,-1%); }
    75%  { transform:translate(-0.5%,-0.5%); }
    100% { transform:translate(0,0); }
  }

  .vignette{
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse 75% 75% at 50% 50%, transparent 45%, var(--vignette) 130%);
    animation:vignetteBreathe 10s ease-in-out infinite;
  }

  @keyframes vignetteBreathe{
    0%, 100% { opacity:0.4; }
    50%      { opacity:0.54; }
  }

  .cover-wrap{
    position:relative;
    height:min(92vh, 92vw / 0.7617);
    width:min(92vw, 92vh * 0.7617);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:breathe 8s ease-in-out infinite;
    filter:drop-shadow(0 0 0.6vw rgba(20,40,40,0.3));
  }

  @keyframes breathe{
    0%, 100% { transform:scale(1); }
    50%      { transform:scale(1.007); }
  }

  .cover-wrap svg{
    width:100%;
    height:100%;
    color:var(--ink);
    mix-blend-mode:multiply;
  }

  /* the date palms, each swaying from its own base on its own clock */
  .palm{ transform-box: fill-box; transform-origin: 50% 100%; }

  .palm0{ animation: swayA 7.0s ease-in-out infinite; }
  .palm1{ animation: swayB 8.3s ease-in-out infinite; }
  .palm2{ animation: swayA 7.6s ease-in-out infinite reverse; }
  .palm3{ animation: swayB 9.1s ease-in-out infinite reverse; }

  @keyframes swayA{
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(-0.85deg); }
    50%  { transform: rotate(0.25deg); }
    75%  { transform: rotate(0.8deg); }
    100% { transform: rotate(0deg); }
  }

  @keyframes swayB{
    0%   { transform: rotate(0deg); }
    30%  { transform: rotate(0.75deg); }
    55%  { transform: rotate(-0.3deg); }
    80%  { transform: rotate(-0.9deg); }
    100% { transform: rotate(0deg); }
  }

  .edge{
    position:absolute;
    inset:2%;
    border:1px solid rgba(32,57,58,0.22);
    box-shadow:
      inset 0 0 40px rgba(32,57,58,0.22),
      0 0 30px rgba(0,0,0,0.18);
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .grain, .vignette, .cover-wrap, .palm{
      animation:none !important;
    }
  }
</style>
</head>

      <feColorMatrix in="n" type="matrix"

                0 0 0 0 0.28
                0 0 0 -1.8 0.72"/>
    </filter>
    <rect width="300" height="300" filter="url(#pulp)"/>
  </svg>

      <feColorMatrix in="noise" type="matrix"

                0 0 0 0 0.18
                0 0 0 0 0.18
                0 0 0 0.9 0"/>
    </filter>
