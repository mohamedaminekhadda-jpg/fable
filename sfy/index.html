<header class="top">

  <div class="grow"></div>
  <div class="find">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>

    <input id="q" type="search" placeholder="Chercher une expérience…" autocomplete="off" spellcheck="false">
  </div>
  <!-- rempli par app/langue.js : FR / EN, sur la même clé que le reste de Fable -->
  <!-- le compte de Fable : posé par app.js, invisible s’il n’est pas configuré -->
  <span class="compte-hote" id="compte-hote"></span>
  <div class="langsel" id="langsel" role="group" aria-label="Langue"></div>
  <button class="icon-btn" id="theme" title="Clair / sombre">◐</button>
</header>

<main class="wrap" id="view"></main>
