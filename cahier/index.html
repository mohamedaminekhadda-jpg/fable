<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook — Le Jaguar</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,0,500;9..144,0,600;9..144,0,900;9..144,1,400;9..144,1,600&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a2238; --ink-soft:#3d4663; --paper:#f4f1ea; --paper-deep:#ebe6db; --desk:#e5ded0;
  --accent:#8c2f2a; --accent-soft:#b05750; --gold:#c9a054; --slate:#6b7089; --rule:#d8d1c2;
  --nav-bg:#1a2238; --nav-text:#f4f1ea; --line:#2b3040;
  --serif:'Fraunces',Georgia,serif; --mono:'Spline Sans Mono',ui-monospace,monospace;
  --gap:32px;             /* ruled-line rhythm (line spacing) — MUST stay divisible by 4 so the Séyès fine grid (gap/4) lands on whole pixels (no moiré on long pages) */
  --rule-shift:10px;      /* ▲ TEXT-ON-LINE: raise the ruled lines so text rests on them; MUST be a whole px (fractional shift blurs every line) — applyScale keeps it rounded */
  --navh:54px; --taskh:36px; --left:264px; --tabs:140px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--serif);overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:0}
input,select,textarea{font-family:inherit}
.mono{font-family:var(--mono)}
.hidden{display:none!important}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--slate)}
svg{display:block}
.ico{width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ═══════════ COVER ═══════════ */
#cover{position:fixed;inset:0;overflow:hidden;background:#0d1017}
.cover-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
/* Le choix de la couverture : des vignettes VIVANTES, pas des noms.
   Une couverture se choisit à l'œil ; une liste déroulante obligerait à
   valider pour voir, puis à rouvrir les réglages pour changer d'avis.
   Chaque vignette est la vraie page, réduite — d'où le scale sur l'iframe. */
.cov-choix{display:flex;gap:12px;flex-wrap:wrap}
/* Trois vignettes tiennent sur la largeur du volet ; une quatrieme ira a la
   ligne d'elle-meme. Le facteur du scale suit la largeur de la vignette :
   122 / 440, sinon l'apercu deborde ou laisse une marge. */
.cov{width:122px;background:none;border:1px solid var(--line,#d8d1c2);border-radius:11px;
  padding:0 0 9px;cursor:pointer;overflow:hidden;text-align:center;font:inherit;color:inherit}
.cov.on{border-color:var(--gold,#c9a054);box-shadow:0 0 0 2px var(--gold,#c9a054) inset}
.cov-vue{display:block;position:relative;width:122px;height:87px;overflow:hidden;background:#e8e3d6}
.cov-vue iframe{position:absolute;top:0;left:0;width:440px;height:313px;border:0;
  transform:scale(.2773);transform-origin:top left;pointer-events:none}
.cov b{display:block;margin-top:7px;font-size:13px}
.cov-quoi{display:block;font-size:11px;opacity:.7;padding:0 7px;line-height:1.35}
.cov-err{font-size:12px;opacity:.7}
/* top-left: a stuck notebook name label (école style) */
.cover-label{position:absolute;top:30px;left:34px;z-index:5;width:290px;background:#fbf7ec;border:4px solid var(--gold);border-radius:14px;padding:14px 20px 12px;box-shadow:0 12px 30px rgba(0,0,0,.4);transform:rotate(-2.4deg)}
.cover-label::before{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(1.5deg);width:92px;height:22px;background:rgba(255,255,255,.35);border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 5px rgba(0,0,0,.12)}
.cover-label .row{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid rgba(42,32,19,.30);padding:8px 0}
.cover-label .row:last-child{border-bottom:0}
.cover-label label{width:58px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#9c8355}
.cover-label input{flex:1;min-width:0;background:none;border:0;outline:none;font-family:'Fraunces',serif;font-size:18px;color:#2a2013}
.cover-label input::placeholder{color:rgba(42,32,19,.28)}
/* top-right badges over the art */
.badges{position:absolute;top:16px;right:16px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;z-index:3;max-width:44%}
.mbadge{position:relative;line-height:0;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4));transition:transform .16s ease}
.mbadge:hover{transform:translateY(-2px) scale(1.06);z-index:6}
.mbadge svg{display:block;border-radius:50%}
.mbadge .tip{position:absolute;top:56px;right:0;display:flex;flex-direction:column;gap:3px;white-space:normal;width:190px;text-align:left;background:#2a2013;color:#f4ecd8;padding:8px 11px;border-radius:8px;opacity:0;pointer-events:none;transform:translateY(-4px);transition:.16s;border:1px solid rgba(244,236,216,.2);box-shadow:0 12px 28px rgba(0,0,0,.45)}
.mbadge .tip b{font-family:var(--serif);font-weight:600;font-size:13px;color:var(--gold);letter-spacing:0;text-transform:none}
.mbadge .tip span{font-family:var(--serif);font-size:12px;font-style:italic;color:#e6dcc4;line-height:1.4}
.mbadge:hover .tip{opacity:1;transform:translateY(0)}
.badge{width:50px;height:50px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(20,14,6,.42);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(244,236,216,.22);position:relative}
.badge .ico{width:15px;height:15px;color:var(--gold)}
.badge .g{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--gold);line-height:1}
.badge b{font-family:var(--mono);font-size:9px;font-weight:600;color:#f4ecd8;letter-spacing:.02em}
.badge .tip{position:absolute;top:56px;right:0;white-space:nowrap;background:#2a2013;color:#f4ecd8;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:5px;opacity:0;pointer-events:none;transition:.15s;border:1px solid rgba(244,236,216,.2)}
.badge:hover .tip{opacity:1}
/* bottom dock — blurred glass over the cover art */
.cover-dock{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  padding:26px 34px 24px;background:linear-gradient(to top,rgba(24,17,8,.72),rgba(24,17,8,.30) 70%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(201,160,84,.35)}
.dock-tools{display:flex;align-items:center;gap:8px}
.dock-tools select,.dock-tools button{background:rgba(20,14,6,.35);border:1px solid rgba(244,236,216,.22);color:#f4ecd8;border-radius:16px;padding:8px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.dock-tools option{background:#2a2013}
.dock-menu{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dock-menu button{padding:12px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,236,216,.82);border:1px solid rgba(244,236,216,.22);border-radius:3px;background:rgba(20,14,6,.25);transition:.16s}
.dock-menu button:hover{color:#fff;border-color:rgba(244,236,216,.5);background:rgba(20,14,6,.45)}
.dock-menu button.primary{color:#2a2013;background:var(--gold);border-color:transparent;font-weight:600}
.dock-menu button.primary:hover{filter:brightness(1.07);color:#2a2013}

/* ═══════════ WORKSPACE ═══════════ */
#work{position:fixed;inset:0;display:none;grid-template-columns:var(--left) 1fr;grid-template-rows:var(--navh) 1fr var(--taskh);grid-template-areas:"nav nav" "left center" "task task";background:var(--desk)}
#work.on{display:grid}

/* top nav — the book bar */
.booknav{grid-area:nav;display:flex;align-items:center;gap:2px;padding:0 14px;background:var(--nav-bg);border-bottom:2px solid var(--accent);overflow-x:auto;scrollbar-width:none}
.booknav::-webkit-scrollbar{display:none}
.nav-back{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--nav-text);flex-shrink:0}
.nav-back:hover{background:rgba(244,241,234,.1);color:var(--gold)}
.nav-brand{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--nav-text);padding:0 16px 0 6px;margin-right:6px;border-right:1px solid rgba(244,241,234,.14);white-space:nowrap;flex-shrink:0}
.tgrp{display:flex;align-items:center;gap:1px;padding:0 8px;border-right:1px solid rgba(244,241,234,.1);flex-shrink:0}
.tgrp:last-of-type{border-right:0}
.tb{height:32px;min-width:30px;padding:0 8px;border-radius:16px;color:rgba(244,241,234,.62);display:inline-flex;align-items:center;justify-content:center;transition:color .15s,background .15s;font-family:var(--serif);font-size:16px}
.tb:hover{color:var(--nav-text);background:rgba(244,241,234,.08)}
.tb.on{color:var(--gold)}
.tb .ico{width:15px;height:15px}
.tb b{font-weight:700}.tb i{font-style:italic;font-family:var(--serif)}.tb u{text-decoration:underline}.tb s{text-decoration:line-through}
.tb-txt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;gap:6px}
.nav-sel{height:30px;background:rgba(244,241,234,.06);border:1px solid rgba(244,241,234,.16);color:var(--nav-text);border-radius:15px;padding:0 12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;outline:none}
.nav-sel option{background:var(--nav-bg)}
.swatch{position:relative;width:30px;height:30px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center}
.swatch input{position:absolute;inset:0;opacity:0;cursor:pointer}
.booknav .sp{flex:1}
.savedot{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,241,234,.4);padding-right:6px;white-space:nowrap;flex-shrink:0}
.savedot.dirty{color:var(--gold)}

/* left rail — the contents */
.left{grid-area:left;background:var(--paper-deep);border-right:1px solid var(--rule);overflow-y:auto;padding:26px 0 40px}
.left-head{padding:0 26px 20px}
.left-head .nm{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.15;margin-top:4px}
.left-head .cl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--slate);margin-top:4px}
.sec{margin-top:6px}
.sec-h{display:flex;align-items:center;gap:14px;padding:16px 26px 8px;cursor:default}
.sec-h .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate);white-space:nowrap}
.sec-h .rl{flex:1;height:1px;background:var(--rule)}
.sec-h .add{color:var(--slate);opacity:0;transition:.15s;display:flex}
.sec:hover .sec-h .add{opacity:1}
.sec-h .add:hover{color:var(--accent)}
.pages{list-style:none;margin:0;padding:0}
.pages li{display:flex;align-items:center;gap:9px;padding:7px 26px 7px 26px;font-family:var(--serif);font-size:16px;color:var(--ink-soft);cursor:pointer;position:relative;transition:color .12s}
.pages li:hover{color:var(--ink)}
.pages li.on{color:var(--accent);font-weight:600}
.pages li.on::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.pages li .lk{width:12px;height:12px;color:var(--slate);flex-shrink:0}
.pages li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pages li .del{margin-left:auto;opacity:0;color:var(--slate);display:flex}
.pages li:hover .del{opacity:.75}
.pages li .del:hover{color:var(--accent)}
.pages .empty{padding:2px 26px 8px;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--slate);opacity:.7}

/* center — the desk + sheet */
/* wide, centred, comfortable reading column; the thin subject tabs sit at the sheet edge (JS-anchored) */
.center{grid-area:center;overflow-y:auto;overflow-x:hidden;padding:34px 84px 48px 56px;display:flex;justify-content:center;transition:padding .25s}
.sheet{position:relative;width:100%;max-width:1000px;transform-origin:top center}
/* collapsible left rail — gives the paper most of the field */
#work{transition:grid-template-columns .25s}
#work.left-hidden{grid-template-columns:0 1fr}
#work.left-hidden .left{opacity:0;pointer-events:none;padding:0;border:0;overflow:hidden}
.left{transition:opacity .2s}
.pagehead{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;padding:0 4px}
.pagehead .ph-k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.pagehead .date{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--slate)}
.paper{background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 30px 60px -30px rgba(26,34,56,.5);min-height:72vh;padding:var(--gap) 60px calc(var(--gap)*2);font-family:var(--serif);font-size:18px;line-height:var(--gap);outline:none;position:relative;background-position:0 calc(var(--rule-shift,0px) * -1)}
.paper:focus{border-color:var(--accent-soft)}
.paper.locked{background:var(--paper)}
.paper>*{margin-top:0}
.paper p{margin:0 0 var(--gap)}
/* titles: line-height = ONE ruled line + whole-gap margins → they rest on the Séyès
   lines and text after them stays on the grid; sizes in em so they scale with the text-size control */
/* headings keep the ruled rhythm: line-box = one --gap, font sized to fit that band
   (so descenders don't spill onto the next rule), footprint always a gap multiple */
.paper .pt{font-family:var(--serif);font-weight:900;font-size:1.38em;line-height:var(--gap);margin:0 0 var(--gap)}
.paper h1{font-family:var(--serif);font-weight:700;font-size:1.26em;line-height:var(--gap);margin:0 0 var(--gap)}
.paper h2{font-family:var(--serif);font-weight:600;font-size:1.12em;line-height:var(--gap);margin:0 0 var(--gap)}
.paper blockquote{border-left:2px solid var(--accent);margin:0 0 var(--gap);padding:0 0 0 20px;font-style:italic;color:var(--ink-soft)}
.paper a{color:var(--accent);text-underline-offset:2px}
.paper ul,.paper ol{margin:0 0 var(--gap);padding-left:26px}
.paper li{line-height:var(--gap)}
.paper ul.nb-task{list-style:none;padding-left:2px}
.paper ul.nb-task li{cursor:pointer}
.paper hr{border:0;border-top:1px solid var(--rule);margin:0 0 calc(var(--gap) - 1px)}
.paper img{max-width:100%;border-radius:3px}
.paper ::selection{background:rgba(201,160,84,.3)}
.paper::after{content:"";display:table;clear:both}
/* templates — ruled to the --gap rhythm, aligned to the text baseline */
.tpl-lined{background-image:linear-gradient(to bottom,transparent calc(var(--gap) - 1px),var(--rule) calc(var(--gap) - 1px));background-size:100% var(--gap);background-repeat:repeat}
/* Pointillés: real dotted guide lines (round dots on the baseline, one row per --gap) */
.tpl-dashed{background-image:radial-gradient(circle at 50% calc(100% - 2px),rgba(96,120,165,.62) 0,rgba(96,120,165,.62) 1.15px,transparent 1.7px);background-size:9px var(--gap)}
.tpl-grid{background-image:linear-gradient(to bottom,var(--rule) 1px,transparent 1px),linear-gradient(to right,var(--rule) 1px,transparent 1px);background-size:100% var(--gap),var(--gap) 100%;background-repeat:repeat}
.tpl-cornell{background-image:linear-gradient(to bottom,transparent calc(var(--gap) - 1px),var(--rule) calc(var(--gap) - 1px)),linear-gradient(90deg,transparent 140px,var(--accent-soft) 140px,var(--accent-soft) 141px,transparent 141px);background-size:100% var(--gap),auto;background-repeat:repeat,no-repeat;padding-left:164px}
/* Séyès (French school paper): fine grid + bold writing line every band + red margin */
/* tiled (finite background-size) so lines stay crisp & drift-free down long pages */
.tpl-seyes{padding-left:72px;
  background-image:
    linear-gradient(90deg,transparent 61px,rgba(198,86,110,.55) 61px,rgba(198,86,110,.55) 62px,transparent 62px),
    linear-gradient(to bottom,transparent calc(var(--gap) - 1px),rgba(86,120,175,.5) calc(var(--gap) - 1px)),
    linear-gradient(to bottom,transparent calc(var(--gap)/4 - 1px),rgba(120,150,195,.22) calc(var(--gap)/4 - 1px)),
    linear-gradient(to right,transparent calc(var(--gap)/4 - 1px),rgba(120,150,195,.22) calc(var(--gap)/4 - 1px));
  background-size:auto, 100% var(--gap), 100% calc(var(--gap)/4), calc(var(--gap)/4) 100%;
  background-repeat:no-repeat, repeat, repeat, repeat}
/* page-break overlay (paged view) */
.paper-wrap{position:relative}
.pagebreaks{display:none}
/* paged view: an empty desk-coloured gap BEHIND the text (::before, z-index:-1), so writing stays visible */
.sheet.paged .paper{z-index:0}
/* page = 30 lines usable + a 2-line gap, all in --gap units so pages land ON the ruled lines at any text size */
.sheet.paged .paper::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(to bottom,
  transparent 0, transparent calc(var(--gap)*30),
  rgba(26,34,56,.16) calc(var(--gap)*30), rgba(26,34,56,.16) calc(var(--gap)*30 + 2px),
  var(--desk) calc(var(--gap)*30 + 2px), var(--desk) calc(var(--gap)*32 - 2px),
  rgba(26,34,56,.06) calc(var(--gap)*32 - 2px), rgba(26,34,56,.06) calc(var(--gap)*32))}
.pgspacer{height:0;pointer-events:none;user-select:none}
/* while dragging/resizing a clip, stop iframes from swallowing the pointer */
body.nb-op iframe{pointer-events:none!important}
body.nb-op{cursor:grabbing;user-select:none}
/* reading mode: dim the pure-editing controls */
#work.reading :is(#styleSel,#fontSel,.swatch,.tb[data-cmd],#imgBtn,#linkBtn,#checkBtn,#addElBtn,#importBtn,#tplSel){opacity:.35;pointer-events:none}
.paper.reading{caret-color:transparent}
.paper a{cursor:text}
.paper.reading a{cursor:pointer}
.paper a:hover{text-decoration-thickness:2px}
.lockbadge{position:absolute;top:calc(var(--gap) - 6px);right:24px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);display:flex;align-items:center;gap:6px}
/* submission panel (Real submissions) */
.subpanel{width:100%;max-width:760px;margin:16px auto 44px;background:var(--paper);border:1px solid var(--rule);border-left:3px solid #8c2f2a;border-radius:10px;padding:16px 22px 18px;box-shadow:0 20px 50px -34px rgba(26,34,56,.6)}
.subpanel[hidden]{display:none}
.sp-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sp-tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8c2f2a;font-weight:600}
.sp-ok{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#2f8a7a}
.sp-todo{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--slate)}
.sp-grade{margin-left:auto;font-family:var(--serif);font-weight:700;color:#8c2f2a}
.sp-ed{min-height:120px;font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:8px;padding:12px 14px;outline:none}
.sp-ed:focus{border-color:#c9a054;box-shadow:0 0 0 3px rgba(201,160,84,.16)}
.sp-ed:empty:before{content:attr(data-ph);color:var(--slate);opacity:.7}
.sp-foot{display:flex;gap:10px;margin-top:12px}
.sp-btn{background:#8c2f2a;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer}
.sp-alt{background:transparent;border:1px solid var(--rule);border-radius:9px;padding:10px 14px;cursor:pointer;color:var(--slate)}
.sp-live{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#c9a054}
.sp-h .ex-timer{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);background:rgba(140,47,42,.08);border:1px solid rgba(140,47,42,.25);border-radius:999px;padding:4px 12px}
.sp-h .ex-timer .et-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.sp-h .ex-timer b{font-size:14px;color:#8c2f2a;font-variant-numeric:tabular-nums}
.sp-h .ex-timer.urgent{background:#8c2f2a;border-color:#8c2f2a;animation:exPulse 1s ease-in-out infinite}
.sp-h .ex-timer.urgent .et-lbl{color:rgba(255,255,255,.8)}.sp-h .ex-timer.urgent b{color:#fff}
@keyframes exPulse{0%,100%{box-shadow:0 0 0 0 rgba(140,47,42,.5)}50%{box-shadow:0 0 0 6px rgba(140,47,42,0)}}
.exam-lock{border-left-color:#c9a054}
.ex-lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 20px}
.ex-lock .ex-lk-ic{width:46px;height:46px;border-radius:50%;background:rgba(140,47,42,.1);display:flex;align-items:center;justify-content:center;color:#8c2f2a}
.ex-lock .ex-lk-ic svg{width:22px;height:22px}
.ex-lk-t{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--ink)}
.ex-lk-d{font-size:13px;color:var(--slate)}
.ex-count{font-family:var(--mono);font-size:40px;font-weight:600;color:#8c2f2a;letter-spacing:.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.ex-lk-sub{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate)}
.ex-intro{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:9px;padding:12px 15px;margin-bottom:14px;white-space:pre-wrap}
.ex-qs{display:flex;flex-direction:column;gap:14px}
.eq{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:13px 15px}
.eq-note{background:transparent;border:0;border-left:3px solid var(--rule);border-radius:0;font-style:italic;color:var(--slate);padding:2px 0 2px 14px}
.eq-p{display:flex;align-items:flex-start;gap:9px;font-family:var(--serif);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:9px}
.eq-n{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#8c2f2a;color:#fff;font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.eq-pts{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--slate);white-space:nowrap}
.eq-a{width:100%;font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;outline:none;min-height:70px;resize:vertical}
.eq-a:focus{border-color:#c9a054;box-shadow:0 0 0 3px rgba(201,160,84,.16)}
.eq-ans{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink);background:var(--paper);border:1px dashed var(--rule);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.eq-opts{display:flex;flex-direction:column;gap:7px}
.eq-opt{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;cursor:pointer;transition:.14s}
.eq-opt:hover{border-color:#c9a054}
.eq-opt.on{border-color:#8c2f2a;background:rgba(140,47,42,.06)}
.eq-opt input{accent-color:#8c2f2a}
.eq-embed{border:1px solid var(--rule);border-radius:8px;padding:10px;overflow:auto}
.ex-hint{font-size:12px;color:var(--slate)}
/* ── exam ON the paper (Séyès layout) ── */
.exam-meta{color:var(--slate);font-size:.78em;letter-spacing:.02em}
.xp-intro{font-style:italic}
.xp-locked{text-align:center;padding:calc(var(--gap)*1.5) 0 var(--gap);color:var(--slate)}
.xp-locked .xp-lkic{width:26px;height:26px;color:#8c2f2a;opacity:.8}
.xp-lk{font-family:var(--serif);font-weight:700;font-size:1.1em;color:var(--ink);margin:8px 0 0;line-height:var(--gap)}
.xp-lk2{font-size:.85em;margin:0;line-height:var(--gap)}
.xp-h{font-family:var(--serif);font-weight:700;font-size:1.12em;line-height:var(--gap);margin:var(--gap) 0 0;color:#8c2f2a}
.xp-note{font-style:italic;color:var(--slate)}
.xp-q{margin:0 0 var(--gap)}
/* question header: exactly one ruled line — the number sits in a left gutter and
   the pts in a right gutter, neither inflating the line box, so the prompt rests
   on the rule and every answer below stays on the grid */
.xp-qh{position:relative;line-height:var(--gap);margin:0;padding-left:34px;padding-right:52px}
.xp-n{position:absolute;left:0;top:calc((var(--gap) - 23px) / 2);width:23px;height:23px;border-radius:50%;background:#8c2f2a;color:#fff;font-family:var(--mono);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center}
.xp-p{font-weight:700}
.xp-pts{position:absolute;right:0;top:0;line-height:var(--gap);font-family:var(--mono);font-size:10px;color:var(--slate);white-space:nowrap}
.xp-ink,.xp-open,.xp-short,.xp-gap,.xp-msel{font-family:var(--serif);color:#1d4f8f}
.xp-open{display:block;width:100%;background:transparent;border:0;outline:none;resize:none;font-size:inherit;line-height:var(--gap);padding:0;overflow:hidden}
.xp-short{background:transparent;border:0;border-bottom:1.5px dashed rgba(29,79,143,.45);outline:none;font-size:inherit;line-height:var(--gap);width:min(60%,26ch);padding:0 4px}
.xp-gap{background:transparent;border:0;border-bottom:1.5px dashed rgba(29,79,143,.45);outline:none;font-size:inherit;line-height:inherit;text-align:center;padding:0 2px;max-width:100%}
.xp-empty{color:var(--slate)}
.xp-ink{line-height:var(--gap);white-space:pre-wrap}
.xp-opts{display:flex;flex-direction:column}
.xp-opt{display:flex;align-items:center;gap:9px;line-height:var(--gap);cursor:pointer}
.xp-opt input{accent-color:#8c2f2a;margin:0}
.xp-opt.on span{color:#1d4f8f;font-weight:600}
.xp-fill{line-height:var(--gap)}
.xp-mrow{display:flex;align-items:baseline;gap:10px;line-height:var(--gap);flex-wrap:wrap}
.xp-ml{min-width:130px;font-weight:600}
.xp-arrow{color:#8c2f2a}
.xp-msel{font-size:.95em;background:transparent;border:0;border-bottom:1.5px dashed rgba(29,79,143,.45);outline:none;padding:0 4px;cursor:pointer}
.xp-fig{margin:var(--gap) 0;text-align:center}
.xp-fig img{max-width:78%;border:1px solid var(--rule);border-radius:4px;box-shadow:0 8px 22px -14px rgba(26,34,56,.5)}
.xp-fig figcaption{font-size:.78em;color:var(--slate);line-height:var(--gap)}
.xp-embed{border:1px solid var(--rule);border-radius:8px;padding:10px;background:#fff;overflow:auto;margin:0 0 var(--gap)}
.exam-bar .sp-h{margin-bottom:0;flex-wrap:wrap}
.exam-bar .sp-btn{margin-left:14px}
.exam-bar .ex-timer{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);background:rgba(140,47,42,.08);border:1px solid rgba(140,47,42,.25);border-radius:999px;padding:4px 12px}
.exam-bar .ex-timer .et-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.exam-bar .ex-timer b{font-size:14px;color:#8c2f2a;font-variant-numeric:tabular-nums}
.exam-bar .ex-timer.urgent{background:#8c2f2a;border-color:#8c2f2a;animation:exPulse 1s ease-in-out infinite}
.exam-bar .ex-timer.urgent .et-lbl{color:rgba(255,255,255,.8)}.exam-bar .ex-timer.urgent b{color:#fff}
/* review shown to the student after grading */
.xp-rev{margin-top:6px;font-size:.85em;color:#2f6c4f;background:rgba(47,138,122,.08);border-left:3px solid #2f8a7a;border-radius:0 8px 8px 0;padding:6px 11px}
/* Cornell task pages: the teacher's mark + comment live in the left margin, aligned to each question */
.paper.tpl-cornell .xp-q{position:relative}
.paper.tpl-cornell .xp-q .xp-rev{position:absolute;left:-158px;top:1px;width:134px;margin:0;padding:1px 9px 4px 2px;background:transparent;border:0;border-right:2px solid #2f8a7a;border-radius:0;text-align:right;font-size:.72em;line-height:1.35;color:#2f6c4f}
.paper.tpl-cornell .xp-q .xp-rev b{display:block}
@media(max-width:900px){.paper.tpl-cornell{padding-left:20px;background-image:linear-gradient(to bottom,transparent calc(var(--gap) - 1px),var(--rule) calc(var(--gap) - 1px))}
  .paper.tpl-cornell .xp-q .xp-rev{position:static;width:auto;text-align:left;border-right:0;border-left:3px solid #2f8a7a;border-radius:0 8px 8px 0;padding:6px 11px;margin-top:6px}}
/* teacher review mode: banner + per-page comment dock */
#work.review-mode #center{padding-top:38px}
.review-banner{position:fixed;top:var(--navh);left:var(--left);right:0;z-index:55;display:flex;align-items:center;gap:10px;background:#8c2f2a;color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 18px}
#work.left-hidden .review-banner{left:0}
.rvdock{width:100%;max-width:760px;margin:8px auto 44px;background:var(--paper);border:1px solid var(--rule);border-left:3px solid #8c2f2a;border-radius:10px;padding:14px 18px 16px;box-shadow:0 20px 50px -34px rgba(26,34,56,.6)}
.rvdock h4{margin:0 0 10px;font-family:var(--serif);font-size:15px;color:#8c2f2a}
.rvdock .cmt{font-size:13.5px;color:var(--ink);border-top:1px solid var(--rule);padding:8px 0}
.rvdock .cmt:first-of-type{border-top:0}
.rvdock .cmt i{display:block;font-size:10.5px;color:var(--slate);font-style:normal;margin-top:2px}
.rvdock .cmt-add{display:flex;gap:8px;margin-top:10px}
.rvdock .cmt-add input{flex:1;font-family:var(--serif);font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;outline:none}
.rvdock .cmt-add button{background:#8c2f2a;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}
.xp-revnote{font-size:.9em;color:var(--ink);background:rgba(201,160,84,.1);border:1px solid rgba(201,160,84,.35);border-radius:9px;padding:9px 13px;margin:0 0 var(--gap)}
.xp-clear{font-size:.85em;color:#2f6c4f;font-style:italic}
/* file attachment chip (projects / homework) */
.xp-file{display:inline-flex;align-items:center;gap:7px;font-size:12px;background:rgba(47,138,122,.1);border:1px solid rgba(47,138,122,.3);border-radius:999px;padding:4px 11px;color:var(--ink);max-width:260px}
.xp-file b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.xp-file i{color:var(--slate);font-style:normal;font-size:11px;white-space:nowrap}
.xp-file button{color:var(--slate);font-size:14px;line-height:1}
.xp-file button:hover{color:#8c2f2a}
.xp-filebtn{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:#2f6c4f;border:1px dashed rgba(47,138,122,.5);border-radius:999px;padding:5px 12px;cursor:pointer;transition:.15s}
.xp-filebtn:hover{background:rgba(47,138,122,.08)}
.lockbadge .ico{width:12px;height:12px}

/* imported textbook clip — a floated, resizable element the notes wrap around */
.nb-clip,.nb-embed{position:relative;width:360px;max-width:100%;margin:4px 0 14px;font-family:var(--serif)}
.nb-clip.fl-right{float:right;margin-left:30px}
.nb-clip.fl-left{float:left;margin-right:30px}
.nb-clip.block{float:none!important;clear:both;margin:16px auto} /* block placement: text does NOT wrap, element sits on its own line, centred */
.nb-embed{margin:0 0 var(--gap)} /* legacy whole-chapter embeds stay block-level */
.nb-clip .bar,.nb-embed .bar{display:flex;align-items:center;gap:8px;background:var(--nav-bg);color:var(--nav-text);padding:7px 10px;border-radius:4px 4px 0 0}
.nb-clip .bar .ico,.nb-embed .bar .ico{width:13px;height:13px;color:var(--gold);flex-shrink:0}
.nb-clip .bar .src,.nb-embed .bar .src{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-clip .bar .sp,.nb-embed .bar .sp{flex:1}
.nb-clip .bar button,.nb-embed .bar button{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:rgba(244,241,234,.75);padding:2px 7px;border-radius:11px;border:1px solid rgba(244,241,234,.22);line-height:1.5}
.nb-clip .bar button:hover,.nb-embed .bar button:hover{color:var(--gold);border-color:var(--gold)}
.nb-clip-body{border:1px solid var(--rule);border-top:0;border-radius:0 0 4px 4px;overflow:hidden;background:#fff;box-shadow:0 10px 26px -14px rgba(26,34,56,.55)}
.nb-clip iframe,.nb-embed iframe{width:100%;border:0;display:block;background:#fff}
.nb-clip .rz{position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--paper);cursor:nwse-resize;box-shadow:0 2px 6px rgba(0,0,0,.3);touch-action:none;z-index:4}
.nb-clip .rz:hover,.nb-clip.dragging .rz{transform:scale(1.15)}
.nb-clip .bar{touch-action:none}
.nb-clip template{display:none}
/* La source d'un extrait de TEXTE voyage dans le document : le nettoyeur du
   serveur retire <template>, et l'attribut hidden avec. Une classe survit. */
.nb-clip .clip-src{display:none}
/* drag-to-move (lifts and follows the cursor, then re-anchors as a float) */
.nb-clip .bar{cursor:grab;user-select:none}
.nb-clip .bar:active{cursor:grabbing}
.nb-clip.dragging{opacity:.9;box-shadow:0 14px 34px -10px rgba(26,34,56,.7)}
.nb-clip.lift{position:fixed!important;float:none!important;margin:0!important;z-index:900;pointer-events:none;opacity:.96;box-shadow:0 26px 60px -14px rgba(26,34,56,.6);transform:rotate(-.6deg) scale(1.01);transition:none}
.nb-drop{height:0;margin:6px 0;border-top:2px solid var(--gold);border-radius:2px;position:relative;pointer-events:none;box-shadow:0 0 8px rgba(201,160,84,.6)}
.nb-drop::before{content:"";position:absolute;left:-4px;top:-5px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px rgba(201,160,84,.7)}
/* editable title + collapse */
.nb-clip .clip-caret{background:none;border:0;color:rgba(244,241,234,.8);cursor:pointer;padding:0 2px;display:inline-flex;flex:0 0 auto}
.nb-clip .clip-caret svg{width:13px;height:13px;transition:transform .2s}
.nb-clip.collapsed .clip-caret svg{transform:rotate(-90deg)}
.nb-clip .src[contenteditable]{cursor:text;outline:none;border-radius:3px;padding:0 3px;min-width:20px}
.nb-clip .src[contenteditable]:focus{background:rgba(244,241,234,.14)}
.nb-clip.collapsed{width:auto!important;min-width:150px;max-width:100%}
.nb-clip.collapsed .nb-clip-body,.nb-clip.collapsed .rz{display:none}
.nb-clip.collapsed .bar{border-radius:4px}
/* checklist (case à cocher) */
.paper ul.nb-task{list-style:none;padding-left:2px;margin:0 0 var(--gap)}
.paper ul.nb-task li{position:relative;padding-left:28px;line-height:var(--gap)}
.paper .chk{position:absolute;left:0;top:.28em;width:17px;height:17px;border:2px solid var(--slate);border-radius:4px;cursor:pointer;background:var(--paper);transition:.12s}
.paper .chk:hover{border-color:var(--accent)}
.paper ul.nb-task li[data-done="1"]>.chk{background:var(--accent);border-color:var(--accent)}
.paper ul.nb-task li[data-done="1"]>.chk::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:12px;line-height:14px;text-align:center;font-family:var(--sans,sans-serif)}
.paper ul.nb-task li[data-done="1"]{text-decoration:line-through;color:var(--slate)}
/* student-added text elements */
.paper .nb-sec{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate);display:flex;align-items:center;gap:14px;margin:var(--gap) 0}
.paper .nb-sec::after{content:"";flex:1;height:1px;background:var(--rule)}
.paper table{border-collapse:collapse;width:100%;margin:0 0 var(--gap);font-size:16px}
.paper th,.paper td{border:1px solid var(--rule);padding:6px 10px;text-align:left;min-width:40px}
.paper th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);background:var(--paper-deep)}
/* editable table with add/remove row-column + per-cell colour */
.paper .nb-tablew{margin:0 0 var(--gap);position:relative}
.paper .nb-tablew table{margin:0}
.tw-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
.tw-tools button{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--slate);background:var(--paper-deep);border:1px solid var(--rule);border-radius:6px;padding:3px 9px;cursor:pointer;line-height:1.4}
.tw-tools button:hover{border-color:var(--accent);color:var(--ink)}
.tw-color{display:inline-flex;align-items:center;gap:5px;margin-left:2px;cursor:pointer}
.tw-color span{font-family:var(--mono);font-size:10.5px;color:var(--slate)}
.tw-color span::before{content:"Couleur"}
.tw-color input{width:26px;height:22px;padding:0;border:1px solid var(--rule);border-radius:5px;background:none;cursor:pointer}
.paper.reading .tw-tools,.paper.locked .tw-tools{display:none}
/* add-element panel */
.add-group{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate);margin:16px 0 6px}
.add-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.add-grid button{display:flex;flex-direction:column;gap:3px;padding:11px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper-deep);text-align:left;font-family:var(--serif);font-size:14px;color:var(--ink);transition:.12s}
.add-grid button:hover{border-color:var(--accent-soft);background:var(--paper)}
.add-grid button small{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
@media(max-width:520px){.add-grid{grid-template-columns:repeat(2,1fr)}}
/* import picker */
.pop .box.imp-wide{width:min(780px,95vw)}
.imp-tip{font-size:14px;color:var(--ink-soft);margin:2px 0 12px;line-height:1.55}
.imp-preview{border:1px solid var(--rule);border-radius:3px;overflow:hidden;height:48vh;background:#fff}
.imp-preview iframe{width:100%;height:100%;border:0;display:block}
.imp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.imp-foot .cnt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.imp-foot .primary{background:var(--accent);color:var(--paper);border:0;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:11px 20px;border-radius:3px}
.imp-foot .primary:disabled{opacity:.4;cursor:default}

/* right — subject index tabs: tucked behind the paper's right edge, symbol-only, expand on hover
   (container.left is anchored just inside the sheet's right edge by JS so the square left edge hides under the paper) */
.subjects{position:fixed;left:0;top:calc(var(--navh) + 40px);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:flex-start}
.tab{position:relative;display:flex;align-items:center;height:38px;width:38px;overflow:hidden;background:var(--accent);color:#fff;font-family:var(--serif);font-weight:700;font-style:italic;font-size:15px;line-height:1;border:0;border-radius:0 10px 10px 0;cursor:pointer;white-space:nowrap;box-shadow:3px 6px 16px -7px rgba(0,0,0,.6);
  transition:width .38s cubic-bezier(.22,1,.36,1),transform .34s cubic-bezier(.34,1.4,.5,1),box-shadow .3s;will-change:width,transform;
  animation:tabIn .5s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.tab::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(255,255,255,.5)}
.tab::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.16),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.tab .tsym{flex:0 0 38px;width:38px;text-align:center;font-family:var(--mono);font-style:normal;font-weight:700;font-size:14px;transition:transform .34s cubic-bezier(.34,1.4,.5,1);display:flex;align-items:center;justify-content:center}
.tab .tsym .ico{width:20px;height:20px;stroke-width:1.75}
.tab .tnm{padding-right:20px;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateX(-6px);transition:opacity .26s .04s,transform .32s cubic-bezier(.22,1,.36,1) .04s}
.tab:hover{width:222px;transform:translateX(-8px);box-shadow:12px 9px 30px -9px rgba(0,0,0,.6)}
.tab:hover::before{opacity:1}
.tab:hover .tnm{opacity:1;transform:none}
.tab:active{transform:translateX(-8px) scale(.97)}
.tab.on{width:222px;transform:translateX(-15px);box-shadow:14px 9px 32px -9px rgba(0,0,0,.6);outline:2px solid rgba(255,255,255,.45);outline-offset:-4px}
.tab.on .tnm{opacity:1;transform:none}
.tab.on .tsym{transform:scale(1.08)}
.tab.addtab{background:var(--paper-deep);color:var(--slate);box-shadow:2px 3px 10px -4px rgba(0,0,0,.35);opacity:.8}
.tab.addtab:hover{opacity:1}
.tab.addtab::after{background:rgba(0,0,0,.12)}
.tab.addtab .tsym{font-size:19px}
.tab.addtab .tnm{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
@keyframes tabIn{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:translateX(0)}}
.subjects .grp-label{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);background:var(--paper-deep);padding:3px 8px 3px 10px;border-radius:0 8px 8px 0;box-shadow:2px 3px 8px -5px rgba(0,0,0,.4);opacity:.8;pointer-events:none}
.subjects .grp-label.perso{margin-top:6px}
.tab .tnm .tlk{font-size:11px;opacity:.7;margin-left:2px}

/* bottom taskbar */
.task{grid-area:task;display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--paper-deep);border-top:1px solid var(--rule);font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--slate)}
.task .who{display:flex;align-items:center;gap:8px;color:var(--ink)}
.task .who .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;letter-spacing:0}
.task .sp{flex:1}
.task .pill{text-transform:uppercase;white-space:nowrap}
.task .zoom{display:flex;align-items:center;gap:7px}
.task .zoom button{color:var(--slate);font-size:14px;width:18px;height:18px;line-height:1}
.task .zoom button:hover{color:var(--accent)}

.toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);background:var(--nav-bg);color:var(--nav-text);font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:10px 18px;border-radius:20px;z-index:900;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:.96}

/* popups */
.pop{position:fixed;inset:0;z-index:800;display:flex;align-items:center;justify-content:center;background:rgba(13,16,23,.55)}
.pop .box{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--accent);border-radius:4px;padding:30px 32px;width:min(480px,92vw);max-height:84vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.pop h3{margin:0 0 4px;font-family:var(--serif);font-weight:600;font-size:23px}
.pop .sub{margin:0 0 18px}
.pop p{line-height:1.7;color:var(--ink-soft)}
.pop .fld{margin:14px 0}
.pop label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);margin-bottom:6px}
.pop input,.pop select{width:100%;background:var(--paper-deep);border:1px solid var(--rule);color:var(--ink);border-radius:3px;padding:10px 12px;font-size:15px;outline:none}
.pop input:focus,.pop select:focus{border-color:var(--accent-soft)}
.pop .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.pop .actions button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:11px 18px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-soft)}
.pop .actions button:hover{border-color:var(--slate)}
.pop .actions .primary{background:var(--accent);color:var(--paper);border-color:transparent}
/* ── friendly per-element editor ── */
.pop .box.wfe-wide{width:min(920px,95vw)}
.wfe{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
@media(max-width:720px){.wfe{grid-template-columns:1fr}}
.wfe-form{min-width:0;max-height:60vh;overflow:auto;padding-right:6px}
.wfe-fld{margin:0 0 13px}
.wfe-fld>label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:5px}
.wfe-fld input[type=text],.wfe-fld input[type=number],.wfe-fld select,.wfe-fld textarea{width:100%;background:var(--paper-deep);border:1px solid var(--rule);color:var(--ink);border-radius:4px;padding:8px 10px;font-size:14px;font-family:inherit;outline:none}
.wfe-fld textarea{min-height:56px;resize:vertical;line-height:1.5}
.wfe-fld input:focus,.wfe-fld select:focus,.wfe-fld textarea:focus{border-color:var(--accent-soft)}
.wfe-num4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.wfe-check{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);cursor:pointer}
.wfe-check input{width:16px;height:16px;accent-color:var(--accent)}
.wfe-list{border:1px solid var(--rule);border-radius:8px;padding:10px;background:rgba(0,0,0,.02)}
.wfe-list>label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:8px}
.wfe-row{position:relative;border:1px solid var(--rule);border-radius:6px;padding:10px 34px 4px 10px;margin-bottom:8px;background:var(--paper)}
.wfe-row .wfe-fld{margin:0 0 8px}
.wfe-row .wfe-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wfe-rm{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:5px;border:1px solid var(--rule);background:var(--paper-deep);color:var(--slate);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wfe-rm:hover{border-color:var(--accent);color:var(--accent)}
.wfe-add{width:100%;padding:8px;border:1px dashed var(--rule);border-radius:6px;background:transparent;color:var(--slate);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.wfe-add:hover{border-color:var(--accent-soft);color:var(--accent)}
.wfe-color{width:100%;height:34px;padding:2px;background:var(--paper-deep);border:1px solid var(--rule);border-radius:4px;cursor:pointer}
.wfe-prev{position:sticky;top:0}
.wfe-prev .wfe-plbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:6px}
.wfe-prev .wfe-frame{width:100%;height:340px;border:1px solid var(--rule);border-radius:8px;background:#fff;overflow:hidden}
.wfe-prev iframe{width:100%;height:100%;border:0;display:block}
.imp-list{margin:6px 0;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.imp-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .12s}
.imp-row:last-child{border-bottom:0}
.imp-row:hover{background:var(--paper-deep)}
.imp-row .t{font-family:var(--serif);font-weight:600;font-size:16px}
.imp-row .m{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin-top:3px}
.imp-row .m2{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.imp-back{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding:2px 0 10px}

/* ═══════════ NOTES & HIGHLIGHTS (reader-style) ═══════════ */
.nb-count{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--gold);color:var(--nav-bg);font-family:var(--mono);font-size:9px;font-weight:700;line-height:1;margin-left:2px}
.nb-count[data-empty="1"]{display:none}
/* the coloured marks in the page */
.paper .nbhl{border-radius:2px;padding:.05em 0;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:pointer;transition:filter .12s}
.paper .nbhl:hover{filter:brightness(.94)}
.paper .nbhl-amber{background:rgba(236,193,90,.5)}
.paper .nbhl-rose{background:rgba(210,120,112,.45)}
.paper .nbhl-mint{background:rgba(126,196,150,.5)}
.paper .nbhl-sky{background:rgba(126,160,214,.45)}
.paper .nbhl.has-note{box-shadow:inset 0 -2px 0 var(--accent)}
/* floating selection toolbar */
.nbsel{position:fixed;z-index:560;display:flex;align-items:center;gap:5px;background:var(--nav-bg);border-radius:24px;padding:6px 9px;box-shadow:0 12px 34px rgba(0,0,0,.4);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .15s,transform .15s;pointer-events:none}
.nbsel.show{opacity:1;transform:none;pointer-events:auto}
.nbsel .pen{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.nbsel .pen:hover{transform:scale(1.14)}
.nbsel .sep{width:1px;height:20px;background:rgba(244,241,234,.16);margin:0 2px}
.nbsel .sb{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--nav-text);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 6px}
.nbsel .sb:hover{color:var(--gold)}
.nbsel .sb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
/* note editor popover */
.nbnote{position:fixed;z-index:570;width:300px;background:var(--nav-bg);color:var(--nav-text);border-radius:10px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:.16s;pointer-events:none}
.nbnote.show{opacity:1;transform:none;pointer-events:auto}
.nbnote .pens{display:flex;gap:8px;margin-bottom:10px}
.nbnote .pen{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.nbnote .pen.sel{border-color:var(--nav-text)}
.nbnote textarea{width:100%;min-height:78px;resize:vertical;background:rgba(244,241,234,.06);border:1px solid rgba(244,241,234,.16);border-radius:6px;color:var(--nav-text);font-family:var(--serif);font-size:15px;line-height:1.5;padding:9px 10px;outline:none}
.nbnote .row{display:flex;align-items:center;gap:8px;margin-top:10px}
.nbnote .sp{flex:1}
.nbnote button{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:0;border-radius:5px;padding:8px 12px;cursor:pointer}
.nbnote .save{background:var(--gold);color:var(--nav-bg);font-weight:700}
.nbnote .del{background:none;color:rgba(244,241,234,.6)}
.nbnote .del:hover{color:var(--accent-soft)}
/* drawer */
.nb-backdrop{position:fixed;inset:0;background:rgba(13,16,23,.5);z-index:600;opacity:0;pointer-events:none;transition:.3s}
.nb-backdrop.show{opacity:1;pointer-events:auto}
.nbdrawer{position:fixed;top:0;right:0;height:100%;width:min(430px,94vw);background:var(--paper);color:var(--ink);z-index:610;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .34s cubic-bezier(.36,.02,.1,1);box-shadow:-22px 0 64px rgba(0,0,0,.3)}
.nbdrawer.show{transform:none}
.nbdrawer header{padding:22px 24px 14px;border-bottom:1px solid var(--rule)}
.nbdrawer header .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.nbdrawer header h3{font-family:var(--serif);font-weight:600;font-size:22px;margin:3px 0 0}
.nbdrawer header .x{position:absolute;top:20px;right:20px;background:none;border:0;color:var(--slate);cursor:pointer;font-size:20px}
.nbdrawer .list{flex:1;overflow-y:auto;padding:12px 18px}
.nbnote-card{border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:6px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.12s;background:var(--paper-deep)}
.nbnote-card:hover{border-color:var(--accent-soft);transform:translateX(-2px)}
.nbnote-card .src{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-bottom:5px}
.nbnote-card .ex{font-family:var(--serif);font-size:15px;line-height:1.4;color:var(--ink)}
.nbnote-card .nt{font-size:13px;color:var(--ink-soft);margin-top:6px;font-style:italic;border-top:1px dashed var(--rule);padding-top:6px}
.nbnote-card .acts{display:flex;gap:12px;margin-top:8px}
.nbnote-card .acts button{background:none;border:0;color:var(--slate);cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:0}
.nbnote-card .acts button:hover{color:var(--accent)}
.nbdrawer .empty{color:var(--slate);font-style:italic;text-align:center;padding:40px 20px;font-size:14px}
.nbdrawer footer{padding:14px 18px;border-top:1px solid var(--rule);display:flex;gap:8px}
.nbdrawer footer button{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:11px;border:1px solid var(--rule);border-radius:5px;background:var(--paper-deep);color:var(--ink-soft);cursor:pointer}
.nbdrawer footer button:hover{border-color:var(--slate)}
/* lookup (dictionary + wikipedia) */
.nblook{position:fixed;top:0;right:0;height:100%;width:var(--lookw,440px);min-width:320px;max-width:94vw;background:linear-gradient(180deg,#1a2136 0,#141a2a 100%);color:#f4f1ea;z-index:620;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .34s cubic-bezier(.36,.02,.1,1);box-shadow:-22px 0 64px rgba(0,0,0,.5);border-left:1px solid rgba(201,160,84,.28)}
.nblook.show{transform:none}
.nblook.resizing{transition:none;user-select:none}
.nblook .grip{position:absolute;left:0;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:5;display:flex;align-items:center;justify-content:center;touch-action:none}
.nblook .grip::before{content:"";width:2px;height:38px;border-radius:2px;background:rgba(244,241,234,.16)}
.nblook .grip:hover::before{background:var(--gold)}
.nblook header{padding:22px 24px 14px;border-bottom:1px solid rgba(244,241,234,.1);display:flex;flex-direction:column;gap:12px;position:relative}
.nblook header .w{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.15;padding-right:26px;word-break:break-word}
.nblook .hd-search{display:flex;gap:0;background:rgba(244,241,234,.06);border:1px solid rgba(244,241,234,.14);border-radius:8px;overflow:hidden}
.nblook .hd-search input{flex:1;background:none;border:0;color:#f4f1ea;font-family:var(--serif);font-size:14px;padding:8px 12px;outline:none}
.nblook .hd-search input::placeholder{color:rgba(244,241,234,.4)}
.nblook .hd-search button{background:none;border:0;color:var(--gold);padding:0 12px;cursor:pointer;font-size:16px}
.nblook .hd-search button:hover{background:rgba(201,160,84,.16)}
.nblook .tabs{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid rgba(244,241,234,.1)}
.nblook .tabs button{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,241,234,.5);background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;transition:color .15s}
.nblook .tabs button:hover{color:rgba(244,241,234,.85)}
.nblook .tabs button.on{color:#f4f1ea;border-bottom-color:var(--gold)}
.nblook .body{flex:1;overflow-y:auto;padding:20px 24px 40px;font-size:15px;line-height:1.62}
/* conjugation: responsive grid of tense cards — more columns as the panel is widened */
.nblook .conjtables{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;align-items:start}
.nblook .conjtables table{width:100%;table-layout:fixed;border-collapse:collapse;margin:0;font-size:12.5px;background:rgba(244,241,234,.035);border:1px solid rgba(244,241,234,.12);border-radius:8px;overflow:hidden}
.nblook .conjtables td,.nblook .conjtables th{border:1px solid rgba(244,241,234,.1);padding:4px 8px;text-align:left;vertical-align:top;color:#eef0f5;white-space:normal;overflow-wrap:break-word;word-break:break-word}
.nblook .conjtables td:first-child{width:42%;color:rgba(238,240,245,.62)}
.nblook .conjtables tr:first-child td,.nblook .conjtables tr:first-child th,.nblook .conjtables th{background:rgba(201,160,84,.14);color:var(--gold);font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;border-color:rgba(201,160,84,.2)}
.nblook .conjtables b,.nblook .conjtables strong{color:#fff;font-weight:600}
.nblook .conjtables a{color:inherit;pointer-events:none;text-decoration:none}
.nblook .conj-mode{grid-column:1/-1;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--gold);margin:10px 0 -2px;padding-bottom:4px;border-bottom:1px solid rgba(201,160,84,.22)}
.nblook .conj-more{grid-column:1/-1;margin:16px 0 0}
.nblook .body .pos{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#141a2a;background:var(--gold);border-radius:5px;padding:3px 9px;margin:18px 0 8px}
.nblook .body .pos:first-child{margin-top:0}
.nblook .body .df{margin:0 0 9px;padding-left:13px;border-left:2px solid rgba(201,160,84,.3);color:rgba(244,241,234,.92)}
.nblook .body .wiki-hero{margin:0 0 16px;border-radius:12px;overflow:hidden;border:1px solid rgba(244,241,234,.12);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.nblook .body .wiki-hero img{display:block;width:100%;max-height:260px;object-fit:cover;margin:0;border-radius:0}
.nblook .body img{max-width:100%;border-radius:8px;margin:6px 0}
.nblook .body a{color:var(--gold)}
.nblook .body .more{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid rgba(201,160,84,.35);border-radius:20px;padding:7px 16px;transition:background .15s}
.nblook .body .more:hover{background:rgba(201,160,84,.14)}
.nblook .body .wiki-noh,.nblook .body .wiki-more-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(244,241,234,.55);margin:18px 0 10px}
.nblook .body .wiki-more-h{border-top:1px solid rgba(244,241,234,.12);padding-top:16px}
.nblook .body .wiki-results{display:flex;flex-direction:column;gap:8px}
.nblook .body .wiki-res{display:block;width:100%;text-align:left;background:rgba(244,241,234,.05);border:1px solid rgba(244,241,234,.1);border-radius:9px;padding:10px 12px;cursor:pointer;transition:background .14s,border-color .14s}
.nblook .body .wiki-res:hover{background:rgba(201,160,84,.12);border-color:rgba(201,160,84,.4)}
.nblook .body .wr-t{display:block;font-family:var(--serif);font-size:15px;font-weight:600;color:#f4f1ea}
.nblook .body .wr-s{display:block;font-size:12px;line-height:1.45;color:rgba(244,241,234,.6);margin-top:3px}
.nblook .body .wiki-results .more{align-self:flex-start}
.nblook .x{position:absolute;top:20px;right:18px;background:none;border:0;color:rgba(244,241,234,.55);font-size:22px;line-height:1;cursor:pointer;z-index:6}
.nblook .x:hover{color:#f4f1ea}
.nblook .loading{color:rgba(244,241,234,.5);font-style:italic;display:flex;align-items:center;gap:10px}
.nblook .body.loading::before{content:"";width:16px;height:16px;border:2px solid rgba(244,241,234,.2);border-top-color:var(--gold);border-radius:50%;animation:nbspin .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:9px}
@keyframes nbspin{to{transform:rotate(360deg)}}
/* share card modal */
.nbshare{position:fixed;inset:0;z-index:700;background:rgba(13,16,23,.8);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:.2s}
.nbshare.show{opacity:1;pointer-events:auto}
.nbshare .box{background:var(--paper);border-radius:8px;padding:20px;max-width:460px;text-align:center}
.nbshare canvas{width:300px;height:300px;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.nbshare .row{display:flex;gap:8px;margin-top:14px}
.nbshare .row button{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:11px;border:1px solid var(--rule);border-radius:5px;background:var(--paper-deep);cursor:pointer}
.nbshare .row .dl{background:var(--accent);color:var(--paper);border-color:transparent}

/* ── scientific calculator ── */
.calc{position:fixed;top:96px;right:34px;width:284px;z-index:640;background:#151b2c;color:#f4f1ea;border:1px solid rgba(201,160,84,.32);border-radius:14px;box-shadow:0 30px 70px -22px rgba(0,0,0,.6);overflow:hidden;font-family:var(--mono);animation:calcIn .26s cubic-bezier(.22,1,.36,1)}
@keyframes calcIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
.calc-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(0,0,0,.22);cursor:grab;user-select:none}
.calc-bar:active{cursor:grabbing}
.calc-t{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.calc-bar .sp{flex:1}
.calc-mode{font-size:9px;letter-spacing:.1em;color:#f4f1ea;background:rgba(244,241,234,.1);border:1px solid rgba(244,241,234,.2);border-radius:20px;padding:3px 9px;cursor:pointer}
.calc-mode.rad{color:var(--gold);border-color:var(--gold)}
.calc-close{background:none;border:0;color:rgba(244,241,234,.6);font-size:19px;line-height:1;cursor:pointer}
.calc-close:hover{color:#fff}
.calc-disp{padding:14px 16px 12px;text-align:right;background:rgba(0,0,0,.14);min-height:64px}
.calc-expr{font-size:12px;color:rgba(244,241,234,.5);min-height:15px;word-break:break-all;line-height:1.3}
.calc-res{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1;margin-top:3px;word-break:break-all}
.calc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(244,241,234,.08);padding:1px}
.calc-keys button{border:0;background:#1b2233;color:#f4f1ea;font-family:var(--mono);font-size:14px;padding:12px 0;cursor:pointer;transition:background .12s}
.calc-keys button:hover{background:#26304a}
.calc-keys button:active{background:var(--gold);color:#151b2c}
.calc-keys .fn{font-size:11px;color:var(--gold);background:#181f30}

/* ── full-page function grapher ── */
.gfull{position:fixed;inset:0;z-index:720;display:flex;background:rgba(20,22,28,.72);backdrop-filter:blur(4px);animation:calcIn .22s ease}
.gfull[hidden]{display:none!important}
.calc[hidden]{display:none!important}
.gfull-side{width:322px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--rule);padding:22px;overflow-y:auto;display:flex;flex-direction:column}
.gfull-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.gfull-head span{font-family:var(--serif);font-weight:700;font-size:20px}
.gfull-head button{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:none;border:1px solid var(--rule);border-radius:20px;padding:7px 13px;cursor:pointer;color:var(--ink)}
.gfull-head button:hover{border-color:var(--accent);color:var(--accent)}
.gfull-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin:14px 0 9px}
.gf-func{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gf-func input[type=text]{flex:1;min-width:0;font-family:var(--mono);font-size:13px;padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper-deep);color:var(--ink);outline:none}
.gf-func input[type=text]:focus{border-color:var(--gold)}
.gf-func input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--rule);border-radius:8px;background:none;cursor:pointer;flex-shrink:0}
.gf-func .rm{background:none;border:0;color:var(--slate);font-size:17px;cursor:pointer;flex-shrink:0}
.gf-func .rm:hover{color:var(--accent)}
.gfull-add{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:none;border:1px dashed var(--rule);border-radius:9px;padding:10px;cursor:pointer;margin-top:2px}
.gfull-add:hover{border-color:var(--gold)}
.gfull-ranges{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gfull-ranges label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);display:flex;flex-direction:column;gap:5px}
.gfull-ranges input{font-family:var(--mono);font-size:13px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper-deep);color:var(--ink);outline:none}
.gfull-ranges input:focus{border-color:var(--gold)}
.gfull-hint{font-size:11px;color:var(--slate);line-height:1.6;margin-top:auto;padding-top:16px}
.gfull-hint code{font-family:var(--mono);background:var(--paper-deep);padding:1px 5px;border-radius:4px;font-size:11px}
.gfull-stage{flex:1;padding:22px;display:flex}
.gfull-stage iframe{flex:1;width:100%;height:100%;border:0;border-radius:12px;background:#fff;box-shadow:0 20px 50px -18px rgba(0,0,0,.5)}
@media(max-width:760px){.gfull{flex-direction:column}.gfull-side{width:auto;max-height:44%}}

/* ── hyperlink hover popup ── */
.linkpop{position:fixed;z-index:650;display:none;align-items:center;gap:10px;background:#151b2c;color:#f4f1ea;border:1px solid rgba(201,160,84,.32);border-radius:9px;padding:7px 11px;font-family:var(--mono);font-size:11px;box-shadow:0 12px 28px -10px rgba(0,0,0,.55)}

.linkpop .lp-go:hover{color:#fff}
.paper a{cursor:pointer}

<script>
/* ═════ helpers ═════ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>(p||'p')+Math.random().toString(36).slice(2,9);
/* interface sounds (WebAudio, offline) — respects the fable_sfx preference */
const SFX=(function(){ let ctx=null,on=true; try{on=(localStorage.getItem('fable_sfx')!=='off');}catch(_){}
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){ctx=null;} } return ctx; }
  function tone(f,d,ty,v,w){ const c=ac(); if(!c)return; const t=c.currentTime+(w||0); const o=c.createOscillator(),g=c.createGain();
    o.type=ty||'sine'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||0.12,t+0.014); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03); }
  const V={ submit(){tone(587.33,0.11,'sine',0.11);tone(880,0.16,'sine',0.10,0.085);tone(1174.7,0.18,'sine',0.08,0.17);}, tick(){tone(660,0.035,'triangle',0.04);} };
  const S={}; Object.keys(V).forEach(k=>{ S[k]=()=>{ if(!on)return; try{const c=ac(); if(c&&c.state==='suspended')c.resume(); V[k]();}catch(_){}}; }); return S; })();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);
  try{ /rendu|remis|enregistr|rendre|travail/i.test(m)?SFX.submit():SFX.tick(); }catch(_){}}
const ICON={
  flame:'<path d="M12 3c3 4 5 6 5 10a5 5 0 01-10 0c0-2 1-3.4 2-4.5.2 2 1 3 2 3.5 1-2-1-4 1-9z"/>',

  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',

};
const svg=(p,cls)=>'<svg class="ico '+(cls||'')+'" viewBox="0 0 24 24">'+p+'</svg>';

const SUBJ_ICO={

function subjectSVG(name){
  const n=(name||'').toLowerCase(); const has=(...k)=>k.some(x=>n.includes(x));
  if(has('éducation physique','education physique','eps','sport')) return SUBJ_ICO.activity;
  if(has('arab')) return SUBJ_ICO.book;
  if(has('frança','francais')) return SUBJ_ICO.pen;
  if(has('angl')) return SUBJ_ICO.chat;
  if(has('math')) return SUBJ_ICO.math;
  if(has('physique','chimie')) return SUBJ_ICO.atom;
  if(has('svt','vie et de la terre','sciences de la vie')) return SUBJ_ICO.leaf;
  if(has('scientif','techno')) return SUBJ_ICO.flask;
  if(has('islam')) return SUBJ_ICO.moon;
  if(has('histoire','géograph','geograph')) return SUBJ_ICO.globe;
  if(has('musiqu','music')) return SUBJ_ICO.music;
  if(has('art')) return SUBJ_ICO.brush;
  if(has('informat')) return SUBJ_ICO.code;
  if(has('philosoph')) return SUBJ_ICO.bulb;
  if(has('lecture','communicat','express','langue')) return SUBJ_ICO.book;
  return null;
}

/* ── teacher-awarded merit badges (mirrored from the platform into nb.awardedBadges) ── */
/* Les médaillons de mérite viennent de lib/badges.js, servi par
   /api/badges.js. Le professeur les attribue depuis la plateforme, l'élève les
   voit ici : les deux applications en gardaient chacune une copie, et les
   dessins avaient déjà divergé — « As des langues » n'était pas le même des
   deux côtés. Une seule table, désormais. */
let MEDAL_NAME = {};
let _badgeSVG = null;
function medalSVG(id, size) { return _badgeSVG ? _badgeSVG(id, size || 46) : ''; }
async function chargeMedaillons() {
  if (_badgeSVG) return;
  try {
    const src = await (await fetch('/api/badges.js')).text();
    const X = {};
    new Function('X', src + ';X.badgeSVG=badgeSVG;X.BADGES=BADGES;')(X);
    _badgeSVG = X.badgeSVG;
    MEDAL_NAME = {};
    X.BADGES.forEach(function (b) { MEDAL_NAME[b.id] = b.name; });
  } catch (e) { /* la couverture s'affiche quand même, sans médaillons */ }
}
async function renderCover(){
  await chargeMedaillons();
  const nb=state.nb;
  const st=(nb.settings)||{}; state.view=st.view||'flow'; state.textScale=st.textScale||1; state.mode=state.review?'read':'edit'; state.leftHidden=!!st.leftHidden;
  document.documentElement.style.setProperty('--gold', nb.brand.accent||'#c9a054');
  $('#pNom').value=nb.student.nom||''; $('#pPrenom').value=nb.student.prenom||''; $('#pClasse').value=nb.student.classe||'';
  // teacher-awarded merit badges (mirrored from the platform) — medallions, most recent first
  const awarded=(nb.awardedBadges||[]).slice().sort((a,b)=>(b.at||0)-(a.at||0));
  $('#badges').innerHTML=awarded.map(b=>{ const nm=MEDAL_NAME[b.badge]||b.badge;
    return '<div class="mbadge">'+medalSVG(b.badge,48)+'<span class="tip"><b>'+esc(nm)+'</b>'+(b.comment?'<span>« '+esc(b.comment)+' »</span>':'')+'</span></div>'; }).join('');
  /* La couverture choisie voyage dans l'URL : l'iframe ne se recharge que si
     elle change vraiment, sinon l'animation repartirait de zéro à chaque
     redessin de la page. */
  const cf=$('#coverFrame');
  const src='nb/cover.html?id='+encodeURIComponent(state.id||'')+'&cover='+encodeURIComponent(nb.brand.cover||'jaguar');
  if(cf.getAttribute('src')!==src)cf.src=src;
}

// anchor the subject tab rail to the sheet's right edge so the open tab rests on the page at any width
function positionTabs(){ const s=$('#sheet'); if(!s)return; const r=s.getBoundingClientRect(); if(r.right>0)$('#subjects').style.left=Math.round(r.right-9)+'px'; }
window.addEventListener('resize',positionTabs);
// keep tabs glued to the page edge across font-load, zoom and layout shifts
try{ new ResizeObserver(positionTabs).observe($('#sheet')); new ResizeObserver(positionTabs).observe($('#center')); }catch(_){}

function loadPage(){
  const p=currentPage(), paper=$('#paper');
  const oldlb=$('.lockbadge',$('#sheet')); if(oldlb)oldlb.remove();
  if(!p){ paper.innerHTML='<p style="color:var(--slate);font-style:italic">Aucune page. Ajoute-en une avec +.</p>'; paper.contentEditable='false'; $('#phDate').textContent=''; renderRails(); return; }
  paper.className='paper tpl-'+(p.template||'seyes');
  paper.innerHTML=p.html||(p.origin==='official'?'':'<p><br></p>');
  // Structured exams live ON the page itself — same paper layout as every other
  // page. Questions appear only inside the session window; answers are written
  // inline (ink on the ruled lines). See renderExamPaper().
  if(hasExamContent(p)) renderExamPaper(p,paper);
  if(p.origin==='official'){ const b=document.createElement('div'); b.className='lockbadge'; b.contentEditable='false'; b.innerHTML=svg(ICON.lock)+'Officiel · lecture seule'; paper.appendChild(b); }
  $('#tplSel').value=p.template||'seyes';
  $('#phDate').textContent=new Date(p.updated||Date.now()).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  applyScale(); applyView(); applyMode(); applyLeft();
  hydrateEmbeds(paper);
  renderRails();
  renderSubPanel(p);
  // teacher can add comments (review mode); everyone sees existing ones
  if(state.review||(p&&(p.comments||[]).length))renderReviewDock(p); else { const d=$('#rvDock'); if(d)d.remove(); }
  schedulePaginate();
}
// Per-page teacher comment thread saved into the student's binder. In review
// mode the teacher can add; otherwise the student just reads the feedback.
function renderReviewDock(p){
  let dock=$('#rvDock');
  if(!dock){ const wrap=$('#paperWrap'); if(!wrap)return; dock=document.createElement('div'); dock.id='rvDock'; dock.className='rvdock'; wrap.appendChild(dock); }
  if(!p){ dock.style.display='none'; return; } dock.style.display='';
  p.comments=Array.isArray(p.comments)?p.comments:[];
  const list=p.comments.length?p.comments.map(c=>'<div class="cmt">'+esc(c.text||'')+'<i>'+esc(c.by||'Enseignant')+' · '+new Date(c.at||Date.now()).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</i></div>').join(''):'<div class="cmt" style="color:var(--slate)">Aucun commentaire pour cette page.</div>';
  const addBox=state.review?'<div class="cmt-add"><input id="rvCmtIn" placeholder="Écrire un commentaire pour l’élève…"><button id="rvCmtGo">Ajouter</button></div>':'';
  dock.innerHTML='<h4>Commentaires de l’enseignant</h4>'+list+addBox;
  if(state.review){
    const add=()=>{ const inp=$('#rvCmtIn'); const v=(inp.value||'').trim(); if(!v)return; p.comments.push({text:v,by:'Enseignant',at:Date.now()}); persist(); renderReviewDock(p); toast('Commentaire ajouté'); };
    $('#rvCmtGo').onclick=add;
    $('#rvCmtIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  }
}
function fmtDur(ms){ if(ms<0)ms=0; const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60,p2=n=>String(n).padStart(2,'0'); if(d>0)return d+' j '+p2(h)+':'+p2(m)+':'+p2(ss); if(h>0)return h+':'+p2(m)+':'+p2(ss); return p2(m)+':'+p2(ss); }
let _subSaveT=0;
function scheduleSubSave(){ clearTimeout(_subSaveT); const d=$('#saveDot'); if(d){d.textContent='non enregistré';d.classList.add('dirty');} _subSaveT=setTimeout(()=>persist(),800); }
// A task page (p.exam): structured exams run the timed exam-runner; simple tasks keep a free answer.
function renderSubPanel(p){
  const sp=$('#subPanel'); if(!sp)return;
  if(sp._timer){ clearInterval(sp._timer); sp._timer=0; }
  if(!p||!p.exam){ sp.hidden=true; sp.innerHTML=''; return; }
  sp.hidden=false;
  if(hasExamContent(p)) return examBar(p,sp);
  // ── simple free-text submission (legacy / unbuilt tasks) ──
  const sub=p.submission||null, done=!!(sub&&sub.submittedAt);
  const when=done?new Date(sub.submittedAt).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
  const graded=(p.grade!=null&&p.grade!=='');
  const isFileTask=(p.exam.type==='project'||p.exam.type==='homework');
  const revNote=(done&&p.review&&p.review.note)?'<div class="xp-revnote"><b>Remarque de l’enseignant :</b> '+esc(p.review.note)+'</div>':'';
  const ti=taskInfo(p);
  sp.innerHTML='<div class="sp-h"><span class="sp-tag">'+esc(ti.n)+'</span>'
    +(done?'<span class="sp-ok">Rendu le '+esc(when)+'</span>':'<span class="sp-todo">À rendre</span>')
    +(graded?'<span class="sp-grade">Note : '+esc(p.grade)+' / 20</span>':'')
    +(isFileTask?fileChipHTML(p,!done):'')+'</div>'
    +revNote
    +'<div class="sp-ed" id="spEd" contenteditable="true" data-ph="Écris ta réponse ici…"></div>'
    +'<div class="sp-foot"><button class="sp-btn" id="spSend">'+(done?'Mettre à jour ma réponse':'Rendre '+ti.v)+'</button>'
    +(done?'<button class="sp-alt" id="spUndo">Reprendre</button>':'')+'</div>';
  bindFileChip(p);
  const ed=$('#spEd'); ed.innerHTML=(sub&&sub.html)||'';
  ed.addEventListener('input',()=>{ p.submission=p.submission||{submittedAt:0}; p.submission.html=ed.innerHTML; scheduleSubSave(); });
  $('#spSend').onclick=()=>{ p.submission=Object.assign({},p.submission,{html:$('#spEd').innerHTML,submittedAt:Date.now()}); persist(); toast('Travail rendu'); renderSubPanel(p); };
  const u=$('#spUndo'); if(u)u.onclick=()=>{ if(p.submission)p.submission.submittedAt=0; persist(); toast('Réponse reprise'); renderSubPanel(p); };
}
// Task-type labels + the correct "Rendre …" verb per type (n = noun/tag, v = "rendre <v>").
const NB_TASK={exam:{n:'Examen',v:'l’examen'},final:{n:'Examen final',v:'l’examen final'},control:{n:'Contrôle',v:'le contrôle'},cc:{n:'Contrôle continu',v:'le contrôle continu'},homework:{n:'Devoir',v:'le devoir'},project:{n:'Projet',v:'le projet'}};
function taskInfo(p){ return NB_TASK[(p&&p.exam&&p.exam.type)||'exam']||NB_TASK.exam; }
/* ═════ exam ON the page (same Séyès layout as every page) ═════ */
function hasExamContent(p){ return !!(p&&p.exam&&p.exam.content&&p.exam.content.questions&&p.exam.content.questions.length); }
const XP_ANSWERABLE=t=>!['text','heading','image','html'].includes(t);
const XP_GRACE=5*60000; // the timer "executes natively" 5 minutes after end time
function examWin(p){ const ex=p.exam; const start=ex.startAt?new Date(ex.startAt).getTime():0; const dur=(ex.durationMin||0)*60000;
  let end=(start&&dur)?start+dur:0;
  const clear=ex.clearUntil?new Date(ex.clearUntil).getTime():0;
  if(clear&&clear>end)end=clear; // teacher granted this student more time
  const hardEnd=end?end+XP_GRACE:0;
  const now=Date.now();
  return { start, end, hardEnd, now, cleared:!!(clear&&clear>now),
    before:!!(start&&now<start), grace:!!(end&&now>=end&&now<hardEnd),
    closed:!!(hardEnd&&now>=hardEnd), submitted:!!(p.submission&&p.submission.submittedAt) }; }
function hasAnswers(p){ const a=p.submission&&p.submission.answers; return !!((a&&Object.values(a).some(v=>v!=null&&String(v).trim()!==''&&v!=='[]'))||(p.submission&&(p.submission.html||p.submission.file))); }
// "La capitale est [Rabat]." → tokens; each [..] becomes a blank the student fills.
function parseFill(t){ const out=[]; let last=0; const re=/\[([^\]]*)\]/g; let m;
  while((m=re.exec(t))){ if(m.index>last)out.push({t:'txt',v:t.slice(last,m.index)}); out.push({t:'gap',v:m[1]}); last=re.lastIndex; }
  if(last<t.length)out.push({t:'txt',v:t.slice(last)}); return out; }
// stable shuffle (per question id) so match options keep their order across renders
function seededShuffle(arr,seed){ const a=arr.map((v,i)=>({v,i})); let s=2166136261;
  for(const ch of String(seed))s=((s^ch.charCodeAt(0))*16777619)>>>0;
  for(let i=a.length-1;i>0;i--){ s=(s*1103515245+12345)>>>0; const j=s%(i+1); const t=a[i];a[i]=a[j];a[j]=t; }
  return a; }
function renderExamPaper(p,paper){
  const ex=p.exam, c=ex.content, w=examWin(p);
  const TASKLBL={exam:'Examen',final:'Examen final',control:'Contrôle',cc:'Contrôle continu',homework:'Devoir',project:'Projet'};
  const meta=[ex.subject&&('Matière : '+ex.subject), ex.semester, ex.startAt&&('Séance : '+new Date(ex.startAt).toLocaleString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+(ex.durationMin?' · '+ex.durationMin+' min':''))].filter(Boolean).map(esc).join(' · ');
  let h='<div class="nb-sec">'+esc(TASKLBL[ex.type]||'Examen')+'</div><h1>'+esc(p.title||'Examen')+'</h1>'+(meta?'<p class="exam-meta">'+meta+'</p>':'')+'<hr>';
  if(w.before){ // sealed — nothing leaks onto the page before the session opens
    h+='<div class="xp-locked" contenteditable="false">'+svg(ICON.lock,'xp-lkic')
      +'<p class="xp-lk">Sujet scellé</p><p class="xp-lk2">Les questions apparaîtront ici, sur cette page, à l’ouverture de la séance.</p></div>';
    paper.innerHTML=h; return;
  }
  const answers=(p.submission&&p.submission.answers)||{};
  const editable=!w.closed&&!w.submitted;
  if(w.cleared&&editable)h+='<p class="xp-clear" contenteditable="false">Délai accordé jusqu’au '+esc(new Date(ex.clearUntil).toLocaleString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))+'.</p>';
  if(c.intro)h+='<p class="xp-intro">'+esc(c.intro)+'</p>';
  const rev=(!editable&&p.review)?p.review:null;
  if(rev&&rev.note)h+='<div class="xp-revnote" contenteditable="false"><b>Remarque de l’enseignant :</b> '+esc(rev.note)+'</div>';
  let n=0;
  c.questions.forEach(q=>{ if(XP_ANSWERABLE(q.type))n++; h+=xpBlock(q,n,answers[q.id],editable,rev); });
  paper.innerHTML=h;
  if(editable)bindExamPaper(p,paper);
}
function xpBlock(q,n,ans,ed,rev){
  const mark=rev&&rev.marks&&rev.marks[q.id]!=null&&rev.marks[q.id]!==''?rev.marks[q.id]:null;
  const comment=rev&&rev.comments&&rev.comments[q.id]?rev.comments[q.id]:'';
  const revHtml=(mark!=null||comment)?'<div class="xp-rev" contenteditable="false">'+(mark!=null?'<b>'+esc(mark)+(q.points?' / '+esc(q.points):'')+' pts</b>':'')+(comment?(mark!=null?' — ':'')+esc(comment):'')+'</div>':'';
  const pts=(q.points&&XP_ANSWERABLE(q.type))?'<span class="xp-pts">'+esc(q.points)+' pts</span>':'';
  if(q.type==='text')return '<p class="xp-note">'+esc(q.prompt)+'</p>';
