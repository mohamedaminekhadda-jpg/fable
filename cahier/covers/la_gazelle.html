<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Gazelle</title>
<style>
  :root{
    --paper-light:#dfa9b3;
    --paper-mid:#cc8f9b;
    --paper-dark:#ab6d7c;
    --ink:#47242e;
    --vignette:#30181e;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--paper-mid);
  }

  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .paper-base{
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 50% at 24% 16%, var(--paper-light) 0%, transparent 60%),
      radial-gradient(ellipse 70% 60% at 82% 84%, var(--paper-dark) 0%, transparent 55%),
      radial-gradient(ellipse 90% 90% at 50% 50%, var(--paper-mid) 0%, var(--paper-dark) 100%);
  }

  /* kraft-board fibre speckle */
  .fleck{
    position:absolute;
    inset:0;
    opacity:0.2;
    mix-blend-mode:multiply;
  }

  .grain{
    position:absolute;
    inset:-10%;
    width:120%;
    height:120%;
    opacity:0.15;
    mix-blend-mode:overlay;
    animation:grainShift 1.5s steps(4) infinite;
  }

  @keyframes grainShift{
    0%   { transform:translate(0,0); }
    25%  { transform:translate(-1%,0.5%); }
    50%  { transform:translate(0.5%,-1%); }
    75%  { transform:translate(-0.5%,-0.5%); }
    100% { transform:translate(0,0); }
  }

  .vignette{
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse 75% 75% at 50% 50%, transparent 45%, var(--vignette) 130%);
    animation:vignetteBreathe 10s ease-in-out infinite;
  }

  @keyframes vignetteBreathe{
    0%, 100% { opacity:0.44; }
    50%      { opacity:0.58; }
  }

  .cover-wrap{
    position:relative;
    height:min(92vh, 92vw / 1.0082);
    width:min(92vw, 92vh * 1.0082);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:breathe 8s ease-in-out infinite;
    filter:drop-shadow(0 0 0.6vw rgba(71,36,46,0.28));
  }

  @keyframes breathe{
    0%, 100% { transform:scale(1); }
    50%      { transform:scale(1.007); }
  }

  .cover-wrap svg{
    width:100%;
    height:100%;
    color:var(--ink);
    mix-blend-mode:multiply;
  }

  /* the gazelle, held in its leap — drifting forward and up, then settling */
  .gazelle{
    transform-box: fill-box;
    transform-origin: 50% 85%;
    animation: bound 6.5s cubic-bezier(0.45,0,0.55,1) infinite;
  }

  @keyframes bound{
    0%   { transform: translate(0, 0) rotate(0deg); }
    45%  { transform: translate(0.55%, -1.35%) rotate(-0.55deg); }
    70%  { transform: translate(0.2%, -0.5%) rotate(-0.2deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  .edge{
    position:absolute;
    inset:2%;
    border:1px solid rgba(48,24,30,0.22);
    box-shadow:
      inset 0 0 40px rgba(48,24,30,0.24),
      0 0 30px rgba(0,0,0,0.18);
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .grain, .vignette, .cover-wrap, .gazelle{
      animation:none !important;
    }
  }
</style>
</head>
